<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta property="og:title" content="Trilha Matemática Banestes"><meta property="og:description" content="Aulas do zero, laboratórios interativos e treino sem fim para a prova do Banestes.">

<style>
/* Layout: app de coluna única, como um caderno de estudos com uma "linha de metrô" ligando os módulos */
:root{
  --bg:#EEF3F8; --surface:#FFFFFF; --sunk:#E3EAF3; --ink:#13213B; --muted:#56637C; --line:#D3DCE8;
  --accent:#1257B0; --accent-ink:#FFFFFF; --gold:#D98C10; --gold-soft:#FBEBCB;
  --ok:#1D8455; --ok-soft:#DDF2E7; --bad:#BE3B33; --bad-soft:#F8E0DD;
  --m1:#1257B0; --m2:#0F8A7E; --m3:#7A4BC4; --m4:#C2571A; --m5:#B03A6E; --m6:#2F7A1F;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1422; --surface:#151F34; --sunk:#1B2740; --ink:#E6ECF6; --muted:#9AA8C2; --line:#283654;
  --accent:#5E9DF2; --accent-ink:#0D1422; --gold:#F2B544; --gold-soft:#3A2F17;
  --ok:#43BE84; --ok-soft:#163626; --bad:#F06D63; --bad-soft:#3D1D1B;
  --m1:#5E9DF2; --m2:#36C2B2; --m3:#A985EE; --m4:#F08A4B; --m5:#EC79AB; --m6:#7CC560; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1422; --surface:#151F34; --sunk:#1B2740; --ink:#E6ECF6; --muted:#9AA8C2; --line:#283654;
  --accent:#5E9DF2; --accent-ink:#0D1422; --gold:#F2B544; --gold-soft:#3A2F17;
  --ok:#43BE84; --ok-soft:#163626; --bad:#F06D63; --bad-soft:#3D1D1B;
  --m1:#5E9DF2; --m2:#36C2B2; --m3:#A985EE; --m4:#F08A4B; --m5:#EC79AB; --m6:#7CC560; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,6vw,40px);font-weight:800;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
a{color:var(--accent)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:17px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-size:15px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:700}
.coin{width:16px;height:16px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 3px var(--gold-soft)}

/* hero */
.hero{padding-top:8px;display:grid;gap:14px}
.hero p.lead{font-size:17px;color:var(--muted);max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--mono);font-size:22px}
.stat span{font-size:13px;color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.panel.recomp{background:var(--gold-soft);border-color:var(--gold)}

/* trilha (metrô) */
.line{position:relative;display:grid;gap:14px;padding-left:34px}
.line::before{content:"";position:absolute;left:13px;top:18px;bottom:18px;width:4px;border-radius:2px;background:var(--line)}
.station{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.station::before{content:"";position:absolute;left:-29px;top:18px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:4px solid var(--mc)}
.station .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.mc{background:color-mix(in srgb,var(--mc) 14%,transparent);color:var(--mc)}
.pips{display:flex;gap:6px}
.pip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.pip.on{border-color:var(--mc);color:var(--mc)}
.pip.done{background:var(--mc);border-color:var(--mc);color:var(--surface)}
.flag{font-size:13px;color:var(--gold);font-weight:700}

/* módulo */
.back{align-self:flex-start;font-weight:700;color:var(--muted);padding:6px 0}
.tabs{display:flex;gap:6px;background:var(--sunk);padding:4px;border-radius:12px;align-self:flex-start}
.tabs button{padding:8px 14px;border-radius:9px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cards{display:grid;gap:14px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid}
.ccard .vis{background:var(--sunk);padding:12px;display:flex;justify-content:center;overflow-x:auto}
.ccard .vis svg{width:100%;max-width:420px;height:auto}
.ccard .txt{padding:16px;display:grid;gap:10px}
.ex{font-family:var(--mono);font-size:14px;background:var(--sunk);border-radius:10px;padding:10px 12px;overflow-x:auto}
.trap{font-size:14px;border-left:4px solid var(--gold);padding:4px 0 4px 10px}
.levels{display:grid;gap:10px}
.lvl{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;flex-wrap:wrap}
.lvl.locked{opacity:.55}
.stars{color:var(--gold);letter-spacing:2px;font-size:18px}

/* quiz */
.qhead{display:grid;gap:8px}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mc,var(--accent));transition:width .3s}
.qtext{font-size:18px;line-height:1.5}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--mc,var(--accent))}
.opt .L{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);font-family:var(--mono);font-weight:700;font-size:14px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.no{background:var(--bad-soft);border:1px solid var(--bad)}
.fb b{font-family:var(--display);font-size:17px}
.res{display:grid;gap:14px;text-align:left}
.big{font-family:var(--mono);font-size:44px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 10px;border-radius:999px;font-size:14px;font-weight:700;background:var(--sunk)}
.links{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.links li{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.links li:first-child{border-top:0}

/* svg tokens */
.vis text{font-family:var(--mono);font-size:12px;fill:var(--ink)}
.vis .t-m{fill:var(--muted)} .vis .t-b{font-weight:700}
.vis .fa{fill:var(--accent)} .vis .fg{fill:var(--gold)} .vis .fs{fill:var(--surface)} .vis .fo{fill:var(--ok)}
.vis .sl{stroke:var(--line);fill:none} .vis .sa{stroke:var(--accent);fill:none} .vis .sg{stroke:var(--gold);fill:none} .vis .si{stroke:var(--ink);fill:none}
.vis .bx{fill:var(--surface);stroke:var(--line)}
/* aulas */
.prog{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.prog .bar{flex:1;min-width:120px}
.alist{display:grid;gap:10px}
.acard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;transition:border-color .15s,transform .15s}
.acard:hover{border-color:var(--mc);transform:translateY(-1px)}
.anum{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;background:color-mix(in srgb,var(--mc) 14%,transparent);color:var(--mc)}
.acard.done .anum{background:var(--mc);color:var(--surface)}
.acard p{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ameta{font-size:12px;color:var(--muted);white-space:nowrap;font-family:var(--mono)}
.lesson{display:grid;gap:20px}
.lvis{background:var(--sunk);border-radius:var(--r);padding:14px;display:flex;justify-content:center;overflow-x:auto}
.lvis svg{width:100%;max-width:480px;height:auto}
.scene{background:color-mix(in srgb,var(--mc) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--mc) 35%,var(--line));border-radius:var(--r);padding:16px 18px;font-size:17px;display:grid;gap:4px}
.scene .eyebrow,.lab .eyebrow{color:var(--mc)}
.blk{display:grid;gap:6px}
.blk p{max-width:70ch}
.f{font-family:var(--mono);font-size:.9em;background:var(--sunk);padding:1px 6px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.worked{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.worked .wq{padding:14px 16px;background:var(--sunk);display:grid;gap:4px}
.worked ol{margin:0;padding:14px 16px 6px 42px;display:grid;gap:8px}
.worked li::marker{font-family:var(--mono);font-weight:700;color:var(--mc)}
.worked .wa{margin:6px 16px 14px;padding:10px 12px;border-radius:10px;background:var(--ok-soft);border:1px solid var(--ok)}
.worked .wbtns{display:flex;gap:8px;flex-wrap:wrap;padding:6px 16px 14px}
.curio{background:var(--gold-soft);border:1px dashed var(--gold);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.curio .eyebrow{color:var(--gold)}
.trapbox{background:var(--bad-soft);border-left:5px solid var(--bad);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.trapbox .eyebrow{color:var(--bad)}
.resumo{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.resumo li{display:flex;gap:10px;align-items:flex-start}
.resumo li::before{content:"✓";flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--mc);color:var(--surface);font-weight:700;font-size:13px}
.lnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.lab{background:var(--sunk);border-radius:var(--r);padding:16px;display:grid;gap:12px;border:1px solid color-mix(in srgb,var(--mc) 30%,var(--line))}
.lab label{display:grid;gap:4px;font-size:14px;font-weight:700}
.lab input[type=range]{width:100%;accent-color:var(--mc)}
.lab input[type=number],.lab select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.lab .out{font-family:var(--mono);font-size:14px}
.lab .vis svg{width:100%;height:auto;max-width:520px;display:block;margin:0 auto}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tbl{overflow-x:auto;background:var(--surface);border-radius:10px}
.tbl table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--muted);font-weight:700}
.tbl tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.forms{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.frow:first-child{border-top:0}
.frow .fn{font-weight:700}
.frow .fn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.frow .ff{font-family:var(--mono);font-size:14px;color:var(--mc);overflow-wrap:anywhere}
.pips{flex-wrap:wrap}
@media (max-width:520px){.frow{grid-template-columns:1fr;gap:4px}.acard{grid-template-columns:auto minmax(0,1fr)}.ameta{display:none}}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
.themebtn{cursor:pointer;font-family:var(--body)}
.themebtn:hover{border-color:var(--accent)}
@media (max-width:420px){.themebtn .tlab{display:none}.top .pills{flex-wrap:nowrap;gap:6px}.top .pill{padding:4px 8px}.brand{font-size:15px;white-space:nowrap;gap:8px}.brand-mark{width:26px;height:26px}}
/* ---------- Jon, passo a passo, treino ---------- */
.tico{display:flex;gap:10px;align-items:flex-start}
.tico .tc{flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.tico .bub{position:relative;background:var(--surface);border:2px solid var(--gold);border-radius:14px;padding:10px 14px;font-size:15.5px;line-height:1.5;min-width:0}
.tico .bub::before{content:"";position:absolute;left:-9px;top:16px;border:8px solid transparent;border-right-color:var(--gold);border-left:0}
.tico.sm .tc{width:38px;height:38px}.tico.sm .bub{border:0;padding:4px 0;background:none}.tico.sm .bub::before{display:none}
.hero .tico{animation:bob 3s ease-in-out infinite}
.hero .tico .tc{width:76px;height:76px}
@keyframes bob{50%{transform:translateY(-3px)}}
.zero{display:grid;gap:14px;background:color-mix(in srgb,var(--gold) 9%,var(--surface));border:2px solid color-mix(in srgb,var(--gold) 50%,var(--line));border-radius:18px;padding:16px}
.zero>.eyebrow{color:var(--gold)}
.zlist{display:grid;gap:10px}
.zstep{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:6px;animation:pop .35s ease}
.zstep .zn{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--mc);letter-spacing:.04em;text-transform:uppercase}
.zstep p{max-width:68ch}
.zcheck{border-top:1px dashed var(--line);padding-top:10px;margin-top:4px;display:grid;gap:8px;justify-items:start}
.zans{background:var(--ok-soft);border:1px solid var(--ok);border-radius:10px;padding:8px 12px;animation:pop .3s ease}
.zdots{display:flex;gap:6px;justify-content:center}
.zdots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.zdots i.on{background:var(--gold)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.treino{background:var(--surface);border:2px solid color-mix(in srgb,var(--mc) 45%,var(--line));border-radius:18px;padding:16px;display:grid;gap:12px}
.trhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.trhead .eyebrow{color:var(--mc)}
.trrow{display:flex;gap:8px;flex-wrap:wrap}
.trin{flex:1;min-width:140px;font:inherit;font-family:var(--mono);font-size:18px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.trin:focus{outline:none;border-color:var(--mc)}
.trx{display:grid;gap:10px}
.trhint{background:var(--gold-soft);border-radius:12px;padding:8px 12px}
.trsol{background:var(--sunk);border-radius:12px;padding:12px 14px;display:grid;gap:6px;animation:pop .3s ease}
.trsol ol{margin:0;padding-left:22px;display:grid;gap:4px}
.trsol li::marker{font-family:var(--mono);font-weight:700;color:var(--mc)}
.dv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.dv>div{padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:14px}
.dv>.ok{border-color:var(--ok);background:var(--ok-soft)}
.lab input[type=text]{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;text-transform:uppercase;font-family:var(--mono)}
.lab .out{line-height:1.6}
.lab p.out{font-family:var(--body);font-size:15px}
.lab .opts .opt{font-size:15px}
.cf{position:fixed;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:50;animation:cf .95s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.acard .tagnew{font-size:11px;font-weight:700;color:var(--gold)}
@media (prefers-reduced-motion:reduce){.zstep,.zans,.trsol,.hero .tico{animation:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="brand-mark">%</span>Trilha Matemática</div>
