fin:[['Juros simples','J = C · i · t · M = C(1 + i · t)',''],['Juros compostos','M = C(1 + i)ⁿ',''],['Taxa proporcional','i_mês = i_ano ÷ 12','Regime simples'],['Taxa equivalente','(1 + i_ano) = (1 + i_mês)¹²','Regime composto'],['Nominal → efetiva','(1 + i_nominal ÷ k)ᵏ − 1','k = nº de capitalizações'],['Taxa real (Fisher)','(1 + aparente) = (1 + real)(1 + inflação)',''],['Desconto comercial simples','D = N · i · t · A = N(1 − i · t)','Por fora'],['Desconto racional simples','A = N ÷ (1 + i · t)','Por dentro'],['Desconto racional composto','A = N ÷ (1 + i)ⁿ',''],['Valor presente','VP = VF ÷ (1 + i)ⁿ',''],['Série uniforme','VP = P · [1 − (1 + i)⁻ⁿ] ÷ i','Postecipada'],['SAC','Amort = VP ÷ n · Juros = i × saldo','Parcela decrescente'],['Price','Parcela fixa · Amort = Parcela − Juros','Amortização crescente'],['Regra do 72','n ≈ 72 ÷ i%','Tempo para dobrar']]
};

const fmt=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl=v=>'R$ '+fmt(v);
const pc=v=>String(v).replace('.',',');
const LAB={
 fator:{html:`<p class="muted" style="font-size:14px">Arraste para aplicar duas variações seguidas sobre R$ 100 e veja o fator total.</p>
  <div class="lgrid"><label for="lf1">1ª variação: <span class="out" id="lf1o"></span><input type="range" id="lf1" min="-50" max="100" step="5" value="20"></label>
  <label for="lf2">2ª variação: <span class="out" id="lf2o"></span><input type="range" id="lf2" min="-50" max="100" step="5" value="-20"></label></div>
  <div class="vis" id="lfv"></div><p class="out" id="lfr"></p>`,
  init(el){const a=el.querySelector('#lf1'),b=el.querySelector('#lf2');const up=()=>{const x=+a.value,y=+b.value,f1=1+x/100,f2=1+y/100,v1=100*f1,v2=v1*f2,mx=Math.max(100,v1,v2),H=v=>v/mx*80;
   el.querySelector('#lf1o').textContent=(x>0?'+':'')+x+'%';el.querySelector('#lf2o').textContent=(y>0?'+':'')+y+'%';
   const bars=[[100,'início','fa'],[v1,'após a 1ª','fa'],[v2,'final',v2>=100?'fo':'fg']];
   el.querySelector('#lfv').innerHTML=S(320,130,bars.map((q,i)=>`<rect x="${30+i*100}" y="${108-H(q[0])}" width="60" height="${H(q[0])}" rx="6" class="${q[2]}"/>`+T(60+i*100,102-H(q[0]),brl(q[0]),'t-b')+T(60+i*100,124,q[1],'t-m')).join(''));
   const tot=(f1*f2-1)*100,soma=x+y;el.querySelector('#lfr').innerHTML=`Fator total: ${pc(f1.toFixed(2))} × ${pc(f2.toFixed(2))} = <b>${pc((f1*f2).toFixed(4))}</b> → variação de <b>${tot>0?'+':''}${pc(tot.toFixed(2))}%</b>${Math.abs(tot-soma)>0.001?` (e não ${soma>0?'+':''}${soma}%)`:''}`};a.oninput=b.oninput=up;up()}},
 juros:{html:`<p class="muted" style="font-size:14px">Capital de R$ 1.000. Mude a taxa e o prazo e compare os dois regimes.</p>
  <div class="lgrid"><label for="lj1">Taxa ao mês: <span class="out" id="lj1o"></span><input type="range" id="lj1" min="1" max="10" step="0.5" value="5"></label>
  <label for="lj2">Prazo: <span class="out" id="lj2o"></span><input type="range" id="lj2" min="1" max="36" step="1" value="12"></label></div>
  <div class="vis" id="ljv"></div><p class="out" id="ljr"></p>`,
  init(el){const a=el.querySelector('#lj1'),b=el.querySelector('#lj2');const up=()=>{const i=+a.value/100,n=+b.value,C=1000,Ms=C*(1+i*n),Mc=C*Math.pow(1+i,n);
   el.querySelector('#lj1o').textContent=pc(+a.value)+'%';el.querySelector('#lj2o').textContent=n+(n>1?' meses':' mês');
   const X=k=>44+k*266/n,Y=v=>112-(v-C)/((Mc-C)||1)*88;let ps='',pq='';for(let k=0;k<=n;k++){ps+=(k?'L':'M')+X(k).toFixed(1)+' '+Y(C*(1+i*k)).toFixed(1);pq+=(k?'L':'M')+X(k).toFixed(1)+' '+Y(C*Math.pow(1+i,k)).toFixed(1)}
   el.querySelector('#ljv').innerHTML=S(320,130,`<line x1="44" y1="112" x2="312" y2="112" class="sl"/><line x1="44" y1="20" x2="44" y2="112" class="sl"/><path d="${pq}" class="sg" stroke-width="2.5"/><path d="${ps}" class="sa" stroke-width="2.5"/>`+T(40,116,'1.000','t-m','end')+T(310,126,n+' m','t-m','end')+T(40,26,Math.round(Mc).toLocaleString('pt-BR'),'t-m','end')+`<rect x="54" y="4" width="10" height="10" class="fa"/>`+T(68,13,'simples','','start')+`<rect x="134" y="4" width="10" height="10" class="fg"/>`+T(148,13,'compostos','','start'));
   el.querySelector('#ljr').innerHTML=`Simples: <b>${brl(Ms)}</b> · Compostos: <b>${brl(Mc)}</b> · diferença: ${brl(Mc-Ms)}`};a.oninput=b.oninput=up;up()}},
 dado:{html:`<p class="muted" style="font-size:14px">Lance um dado virtual muitas vezes. Quanto mais lançamentos, mais cada face se aproxima de 1/6 ≈ 16,7%. É a lei dos grandes números.</p>
  <div class="cta"><button class="btn small" data-r="10">+10 lançamentos</button><button class="btn small" data-r="100">+100</button><button class="btn small" data-r="1000">+1.000</button><button class="btn small ghost" data-r="0">Zerar</button></div>
  <div class="vis" id="ldv"></div><p class="out" id="ldr"></p>`,
  init(el){let c=[0,0,0,0,0,0];const up=()=>{const n=c.reduce((s,v)=>s+v,0),Y=p=>110-Math.min(p,0.4)/0.4*90;let o=`<line x1="20" y1="110" x2="310" y2="110" class="sl"/><line x1="20" y1="${Y(1/6)}" x2="310" y2="${Y(1/6)}" class="sg" stroke-width="2" stroke-dasharray="5 4"/>`+T(312,Y(1/6)-5,'1/6','t-b','end');
   c.forEach((v,k)=>{const p=n?v/n:0;o+=`<rect x="${34+k*46}" y="${Y(p)}" width="32" height="${110-Y(p)}" rx="4" class="fa"/>`+T(50+k*46,125,k+1,'t-b')+(n?T(50+k*46,Y(p)-4,(p*100).toFixed(0)+'%','t-m'):'')});
   el.querySelector('#ldv').innerHTML=S(320,130,o);el.querySelector('#ldr').textContent=n?`${n.toLocaleString('pt-BR')} lançamentos`:'Nenhum lançamento ainda. Comece com +10.'};
   el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=+b.dataset.r;if(!r)c=[0,0,0,0,0,0];for(let k=0;k<r;k++)c[Math.floor(Math.random()*6)]++;up()});up()}},
 amort:{html:`<p class="muted" style="font-size:14px">Monte a tabela de um empréstimo e compare os dois sistemas. Troque SAC por Price e veja o total de juros mudar.</p>
  <div class="lgrid"><label for="la1">Valor (R$)<input type="number" id="la1" value="30000" min="100" step="100"></label><label for="la2">Taxa ao mês (%)<input type="number" id="la2" value="2" min="0.1" max="20" step="0.1"></label><label for="la3">Parcelas<input type="number" id="la3" value="5" min="1" max="48" step="1"></label><label for="la4">Sistema<select id="la4"><option value="sac">SAC</option><option value="price">Price</option></select></label></div>
  <div class="tbl" id="lat"></div>`,
  init(el){const g=s=>el.querySelector(s);const up=()=>{const V=Math.max(0,+g('#la1').value||0),i=Math.max(0.0001,(+g('#la2').value||0)/100),n=Math.min(48,Math.max(1,Math.round(+g('#la3').value||1))),sac=g('#la4').value==='sac';
   let s=V,rows='',tj=0,tp=0;const P=V*i/(1-Math.pow(1+i,-n));
   for(let k=1;k<=n;k++){const j=s*i,am=sac?V/n:P-j,pa=am+j;s-=am;tj+=j;tp+=pa;rows+=`<tr><td>${k}</td><td>${fmt(pa)}</td><td>${fmt(j)}</td><td>${fmt(am)}</td><td>${fmt(Math.max(0,s))}</td></tr>`}
   g('#lat').innerHTML=`<table><thead><tr><th>Mês</th><th>Parcela</th><th>Juros</th><th>Amortização</th><th>Saldo</th></tr></thead><tbody><tr><td>0</td><td></td><td></td><td></td><td>${fmt(V)}</td></tr>${rows}<tr class="tot"><td>Total</td><td>${fmt(tp)}</td><td>${fmt(tj)}</td><td>${fmt(V)}</td><td></td></tr></tbody></table>`};
   el.querySelectorAll('input,select').forEach(x=>x.oninput=up);up()}}
};
const strip=s=>s.replace(/<[^>]+>/g,'');
/* ---------- explicações do zero (passo a passo do Jon) ----------
   DEV['mod-i'] = {oi: fala de abertura, s: [[título, texto, [pergunta, resposta]?], ...]} */
const DEV={
'num-0':{oi:'Número negativo assusta, mas você já usa todo dia: é dívida, temperatura abaixo de zero, saldo no vermelho. Vamos por partes.',s:[
 ['Pense em dinheiro','Número positivo é dinheiro que você <b>tem</b>. Número negativo é dinheiro que você <b>deve</b>. Se o app do banco mostra −80, você está devendo R$ 80. O zero é a linha que separa as duas coisas.'],
 ['A reta é uma régua de dinheiro','Imagine uma régua deitada com o zero no meio. Para a direita, os números crescem (mais dinheiro). Para a esquerda, diminuem (mais dívida). Por isso −10 é <b>menor</b> que −2: dever 10 é pior que dever 2.',['Quem é maior: −15 ou −4?','−4. Dever R$ 4 é melhor que dever R$ 15; na reta, −4 fica mais à direita.']],
 ['Somar é andar na reta','Ganhar (+) é andar para a direita. Gastar (−) é andar para a esquerda. Em <span class="f">−30 + 50</span>, você começa devendo 30 e recebe 50: paga a dívida e sobram 20. Resultado: <b>+20</b>.',['Quanto dá −25 + 10?','−15. Você devia 25, pagou 10, ainda deve 15.']],
 ['Dois gastos seguidos','<span class="f">−7 − 5</span>: você já devia 7 e gastou mais 5. A dívida <b>cresce</b>: −12. Sinais iguais na soma: some e mantenha o sinal. Aqui o “menos com menos” <b>não</b> vira mais.'],
 ['Multiplicar: a regra do amigo','Na multiplicação e na divisão, lembre: “o amigo do meu amigo é meu amigo” (+ · + = +), “o inimigo do meu inimigo é meu amigo” (− · − = +), “o amigo do meu inimigo é meu inimigo” (+ · − = −).',['Quanto é (−6) × (−3)?','+18. Sinais iguais na multiplicação dão positivo.']]]},
'num-1':{oi:'Potência é só um jeito curto de escrever uma multiplicação repetida. Quem sabe tabuada já sabe potência!',s:[
 ['Atalho de escrita','Em vez de escrever 3 × 3 × 3 × 3, escrevemos <span class="f">3⁴</span>. O número de baixo (3) é o que se repete; o de cima (4) diz <b>quantas vezes</b>. Logo 3⁴ = 81.',['Quanto é 2⁵?','2 × 2 × 2 × 2 × 2 = 32.']],
 ['Não é multiplicação comum','<span class="f">2³</span> não é 2 × 3 = 6. É 2 × 2 × 2 = <b>8</b>. Esse é o erro mais comum de quem está começando. Na dúvida, escreva a multiplicação por extenso.'],
 ['Expoente 1 e expoente 0','Qualquer número elevado a 1 é ele mesmo (7¹ = 7). Elevado a 0 dá <b>1</b> (7⁰ = 1). Para lembrar: 7³ = 343, 7² = 49, 7¹ = 7… a cada passo dividimos por 7, então o próximo é 7 ÷ 7 = 1.'],
 ['O parêntese manda no sinal','<span class="f">(−2)²</span> = (−2) × (−2) = +4: o sinal está dentro e entra na multiplicação. Já <span class="f">−2²</span> = −(2 × 2) = −4: o sinal ficou de fora, esperando.',['Quanto é (−1)⁷?','−1. Expoente ímpar mantém o sinal negativo.']],
 ['A fila das operações','Numa expressão, resolva como uma fila com prioridade: <b>1º</b> parênteses, <b>2º</b> potências, <b>3º</b> multiplicação e divisão, <b>4º</b> soma e subtração. Dentro de cada etapa, da esquerda para a direita.',['Quanto é 10 − 2 × 3?','4. Primeiro 2 × 3 = 6, depois 10 − 6.']]]},
'num-2':{oi:'Múltiplos e divisores são a tabuada vista de dois lados. Vamos usar balas e saquinhos para entender.',s:[
 ['Múltiplo é tabuada','Os múltiplos de 4 são os resultados da tabuada do 4: 0, 4, 8, 12, 16, 20… Eles nunca acabam.',['O 36 é múltiplo de 4?','Sim: 4 × 9 = 36.']],
 ['Divisor divide sem sobrar','Você tem 12 balas e quer encher saquinhos iguais sem sobrar nada. Dá para fazer saquinhos de 1, 2, 3, 4, 6 ou 12 balas. Esses são os <b>divisores</b> de 12. Saquinhos de 5? Sobram 2 balas: 5 não é divisor de 12.'],
 ['Critérios são atalhos','Termina em 0, 2, 4, 6 ou 8? Divide por 2. Termina em 0 ou 5? Divide por 5. A soma dos algarismos divide por 3? O número divide por 3. Ex.: 2.451 → 2 + 4 + 5 + 1 = 12, então divide por 3.',['252 é divisível por 9?','Sim: 2 + 5 + 2 = 9, que é divisível por 9.']],
 ['Primos são os tijolos','Número primo só tem dois divisores: 1 e ele mesmo (2, 3, 5, 7, 11, 13…). Todo número é construído multiplicando primos, como uma parede feita de tijolos: 60 = 2 × 2 × 3 × 5.'],
 ['Fatorar sem errar','Divida sempre pelo <b>menor primo possível</b> e vá anotando numa coluna: 60 ÷ 2 = 30; 30 ÷ 2 = 15; 15 ÷ 3 = 5; 5 ÷ 5 = 1. Os primos usados formam a fatoração: 2² × 3 × 5.']]},
'num-3':{oi:'MMC e MDC confundem muita gente porque os nomes são parecidos. Vou te dar um jeito de nunca mais trocar.',s:[
 ['MMC é reencontro','Dois amigos correm numa pista: um passa pela largada a cada 4 minutos, o outro a cada 6. Quando passam juntos de novo? Liste: 4, 8, <b>12</b>… e 6, <b>12</b>… Em 12 minutos. Esse é o MMC: o primeiro <b>reencontro</b>.'],
 ['MDC é corte','Você tem uma fita de 12 m e outra de 18 m e quer cortar pedaços iguais, os maiores possíveis, sem sobra. Divisores de 12: 1, 2, 3, 4, <b>6</b>, 12. De 18: 1, 2, 3, <b>6</b>, 9, 18. O maior em comum é 6 m. Esse é o MDC: o <b>maior pedaço</b>.'],
 ['Frase para memorizar','<b>MMC: “mais tarde a gente se encontra”</b> (a resposta é maior ou igual aos números).<br><b>MDC: “divide em pedaços”</b> (a resposta é menor ou igual aos números).',['Lâmpadas piscam a cada 3 e 5 segundos. É MMC ou MDC?','MMC: queremos saber quando piscam juntas (reencontro). Resposta: 15 s.']],
 ['Jeito rápido: dividir junto','Coloque os números lado a lado e divida pelos primos: 12, 18 ÷ 2 → 6, 9 ÷ 2 → 3, 9 ÷ 3 → 1, 3 ÷ 3 → 1, 1. MMC = 2 × 2 × 3 × 3 = 36. Para o MDC, multiplique só os primos que dividiram <b>os dois ao mesmo tempo</b>: 2 × 3 = 6.']]},
'num-4':{oi:'Fração é pizza! Se você sabe dividir uma pizza com os amigos, já sabe frações.',s:[
 ['O de baixo corta, o de cima pega','Em <span class="f">3/8</span>, o 8 diz que a pizza foi cortada em 8 fatias iguais. O 3 diz que você pegou 3 delas. Quanto maior o número de baixo, <b>menor</b> cada fatia: 1/8 é menor que 1/4.',['O que é maior: 1/3 ou 1/5?','1/3. Pizza cortada em 3 tem fatias maiores do que cortada em 5.']],
 ['Mesma pizza, outro corte','1/2 da pizza é igual a 2/4 e a 4/8: muda o número de cortes, mas a quantidade de pizza é a mesma. Multiplicar ou dividir em cima e embaixo pelo mesmo número não muda a fração.'],
 ['Somar só com fatias iguais','Não dá para somar 1/2 + 1/3 direto: as fatias têm tamanhos diferentes. Recorte tudo em sextos (MMC de 2 e 3 = 6): 1/2 = 3/6 e 1/3 = 2/6. Agora sim: 3/6 + 2/6 = <b>5/6</b>.',['Quanto é 1/4 + 1/2?','3/4. 1/2 = 2/4; 1/4 + 2/4 = 3/4.']],
 ['“De” significa vezes','“2/3 de 90”: descubra quanto vale uma fatia (90 ÷ 3 = 30) e pegue as fatias pedidas (30 × 2 = 60).',['Quanto é 3/4 de 200?','150. 200 ÷ 4 = 50; 50 × 3 = 150.']],
 ['Fração vira decimal','Fração é uma divisão: 3/4 = 3 ÷ 4 = 0,75. Vale decorar as mais comuns: 1/2 = 0,5 · 1/4 = 0,25 · 3/4 = 0,75 · 1/5 = 0,2 · 1/10 = 0,1.']]},
'prop-0':{oi:'Razão é comparar duas coisas por divisão. Receita de suco é a melhor professora de proporção.',s:[
 ['Razão é um “para cada”','“Para cada 2 copos de suco concentrado, 5 de água.” A razão concentrado : água é 2 : 5, ou 2/5. Razão sempre compara <b>na ordem</b> em que a frase fala.'],
 ['Proporção: aumentar sem estragar','Para fazer o dobro do suco, dobre <b>tudo</b>: 4 de concentrado e 10 de água. As razões 2/5 e 4/10 são iguais: isso é uma <b>proporção</b>. Se mudar só um ingrediente, o suco fica fraco ou forte demais.'],
 ['Multiplicar em cruz','Numa proporção a/b = c/d, vale <span class="f">a × d = b × c</span>. Ex.: 2/5 = x/20 → 5 × x = 2 × 20 → 5x = 40 → x = 8.',['Se 3/4 = x/12, quanto vale x?','9. 4x = 36, então x = 9.']],
 ['O truque do k','Se a razão entre homens e mulheres é 3 : 2, escreva homens = 3k e mulheres = 2k. Se o grupo tem 40 pessoas: 3k + 2k = 40 → 5k = 40 → k = 8. Homens = 24, mulheres = 16. O k é o tamanho de cada “porção”.']]},
'prop-1':{oi:'Dividir em partes proporcionais é repartir de forma justa: quem colocou mais, leva mais.',s:[
 ['Conte as porções','R$ 600 divididos na proporção 1 : 2. Pense em porções: o primeiro leva 1 porção, o segundo leva 2. Total: 1 + 2 = 3 porções.'],
 ['Quanto vale uma porção','Divida o total pelo número de porções: 600 ÷ 3 = <b>200</b>. Cada porção vale R$ 200. Esse é o famoso k.'],
 ['Distribua e confira','Primeiro: 1 × 200 = R$ 200. Segundo: 2 × 200 = R$ 400. Confira somando: 200 + 400 = 600. ✓',['R$ 900 na proporção 2 : 3 : 4. Quanto vale a maior parte?','R$ 400. São 9 porções de 100; a maior tem 4.']],
 ['E a inversamente proporcional?','Aqui quem tem o <b>maior número</b> leva <b>menos</b> (mais faltas, menor prêmio). Troque cada número pelo inverso (2 → 1/2, 3 → 1/3), multiplique todos pelo MMC para sumir com as frações e aí divida normalmente.']]},
'prop-2':{oi:'Regra de três é a ferramenta mais usada da prova. A pergunta-chave é uma só: as grandezas andam juntas ou em sentidos opostos?',s:[
 ['O que é grandeza','Grandeza é tudo que dá para medir ou contar: quilos, reais, horas, pessoas, km/h. Numa regra de três aparecem duas grandezas e você conhece três valores. Falta descobrir o quarto: o x.'],
 ['Monte a tabelinha','Organize sempre em colunas, cada grandeza na sua:<br><span class="f">kg | R$</span><br><span class="f">&nbsp;3 | 24</span><br><span class="f">&nbsp;5 | &nbsp;x</span><br>Mesma unidade embaixo da mesma unidade. Isso já evita metade dos erros.'],
 ['Teste do dobro','Pergunte: “se eu levar o dobro de quilos, pago o dobro?” Sim → as grandezas andam <b>juntas</b>: <b>diretamente proporcionais</b>. “Se eu dobrar os caixas, a fila dobra?” Não, cai pela metade → <b>inversamente proporcionais</b>.',['Mais pedreiros constroem o muro em mais ou menos dias?','Menos dias. Pedreiros e dias são inversamente proporcionais.']],
 ['Direta: multiplique em cruz','<span class="f">3/5 = 24/x</span> → 3x = 5 × 24 → 3x = 120 → x = 40. Jeito mais intuitivo: ache o valor de 1 unidade primeiro. 3 kg = R$ 24 → 1 kg = R$ 8 → 5 kg = R$ 40.'],
 ['Inversa: multiplique em linha','6 caixas levam 40 min; 8 caixas levam x. Na inversa, o produto de cada linha é o mesmo (é o “trabalho total”): <span class="f">6 × 40 = 8 × x</span> → 240 = 8x → x = 30 min.',['4 pintores levam 6 dias. Quantos dias levam 8 pintores?','3 dias. 4 × 6 = 8 × x → x = 3.']],
 ['Confira com bom senso','Achou o x? Pergunte se faz sentido. Abriu mais caixas e a fila ficou <b>maior</b>? Errou o tipo. Esse teste de 5 segundos salva muitas questões na prova.']]},
'prop-3':{oi:'Porcentagem é só uma fração com denominador 100. Vou te mostrar como fazer quase todas de cabeça.',s:[
 ['Por cento = a cada cem','25% quer dizer 25 a cada 100. Imagine 100 quadradinhos: pintar 25 deles é pintar 25% da figura. Por isso 100% é o todo, 50% é a metade e 25% é um quarto.'],
 ['O 10% é o seu melhor amigo','Para achar 10%, divida por 10 (ande a vírgula uma casa para a esquerda): 10% de 350 = 35. A partir dele você monta quase tudo: 20% = 2 × 35 = 70; 5% = metade de 35 = 17,5; 30% = 3 × 35 = 105.',['Quanto é 30% de 80?','24. 10% de 80 = 8; 30% = 3 × 8.']],
 ['O 1% para os quebrados','1% é dividir por 100 (andar duas casas): 1% de 2.400 = 24. Então 3% = 72 e 0,5% = 12.'],
 ['Calculadora mental','Transforme em decimal e multiplique: 18% = 0,18. Então 18% de 50 = 0,18 × 50 = 9. “% de” é sempre vezes.'],
 ['Que porcentagem é?','Para saber quanto 15 representa de 60, faça parte ÷ todo: 15 ÷ 60 = 0,25 = <b>25%</b>. O “todo” é sempre o que vem depois do “de”.',['12 é quantos por cento de 48?','25%. 12 ÷ 48 = 0,25.']]]},
'prop-4':{oi:'Aqui mora a pegadinha favorita da banca: aumentos e descontos seguidos. O segredo é o fator multiplicativo.',s:[
 ['Aumentar 10% é ficar com 110%','Se algo valia 100% e aumentou 10%, agora vale 110%: multiplique por <b>1,10</b>. Se teve desconto de 10%, sobraram 90%: multiplique por <b>0,90</b>.',['Qual o fator de um aumento de 35%?','1,35.']],
 ['Um passo só','Preço de R$ 80 com aumento de 15%: 80 × 1,15 = R$ 92. Não precisa calcular os 15% separado e somar depois (mas, se preferir, dá o mesmo: 80 + 12).'],
 ['Variações seguidas: multiplique','Aumento de 20% e depois desconto de 20%: 1,2 × 0,8 = 0,96. O preço terminou em 96% do original: <b>caiu 4%</b>. O desconto foi calculado sobre um valor que já era maior.'],
 ['Desfazendo um aumento','Se depois de aumentar 25% o produto custa R$ 150, divida pelo fator: 150 ÷ 1,25 = R$ 120. Não tire 25% de 150! A base dos 25% era o preço antigo.',['Depois de 10% de desconto, custa R$ 90. Qual era o preço?','R$ 100. 90 ÷ 0,9 = 100.']]]},
'log-0':{oi:'Lógica parece difícil, mas funciona como interruptores de luz. Vamos acender umas lâmpadas!',s:[
 ['Proposição é frase V ou F','“O Banestes é um banco” é proposição (verdadeira). “Que horas são?” não é: pergunta não é verdadeira nem falsa. Ordens (“Feche a porta”) e exclamações também não são.',['“x + 2 = 5” é proposição?','Não: depende de x. Sentença aberta não é proposição.']],
 ['“E” é exigente','“Estudei <b>e</b> dormi bem.” Só é verdade se as duas partes forem verdade. É como uma lâmpada com dois interruptores em fila: os dois precisam estar ligados.'],
 ['“Ou” é tranquilo','“Vou de ônibus <b>ou</b> de carro.” Basta uma parte ser verdade. São dois interruptores lado a lado: qualquer um acende a lâmpada. Só é falso se as duas forem falsas.'],
 ['“Se… então” é uma promessa','“Se fizer sol, então vou à praia.” Quando a promessa é quebrada? Só quando faz sol e eu <b>não</b> vou. Se não fizer sol, posso ir ou não. Por isso a condicional só é falsa no caso <b>V → F</b>.',['“Se chove, levo guarda-chuva.” Não choveu e levei guarda-chuva. V ou F?','Verdadeira. A promessa só fala do caso em que chove.']]]},
'log-1':{oi:'Negar é desmentir alguém. Para desmentir, basta mostrar o contrário com o mínimo de esforço.',s:[
 ['Desmentir “todos”','Se alguém diz “Todos os clientes pagaram”, basta achar <b>um</b> que não pagou: “Algum cliente não pagou”. Não precisa dizer “nenhum pagou”: isso é exagero e não é a negação.'],
 ['Desmentir “nenhum”','“Nenhum cliente reclamou.” Para desmentir, basta um reclamar: “Algum cliente reclamou”.',['Qual a negação de “Algum gerente é rico”?','“Nenhum gerente é rico.”']],
 ['Negar “e” vira “ou”','“Estudei e passei.” Para ser mentira, basta uma parte falhar: “Não estudei <b>ou</b> não passei”. Negue as duas partes e troque o conectivo (Lei de De Morgan).'],
 ['Negar “se… então”: MA-NÉ','Para negar “Se chove, então levo guarda-chuva”, mostre a promessa quebrada: “Chove <b>e</b> não levo guarda-chuva”. <b>MA</b>ntém a primeira, <b>NE</b>ga a segunda, usa “e”.',['Negue: “Se estudo, passo”.','“Estudo e não passo.”']]]},
'log-2':{oi:'Argumento válido é aquele em que a conclusão sai obrigatoriamente das premissas, mesmo que pareça estranho.',s:[
 ['Premissas são as regras do jogo','Num argumento, você aceita as premissas como verdadeiras, mesmo que sejam absurdas, e verifica se a conclusão é obrigatória. “Todo peixe voa. Nemo é peixe. Logo, Nemo voa.” é <b>válido</b>! A lógica checa o encaixe, não a realidade.'],
 ['Desenhe círculos','“Todo A é B” = círculo A dentro do círculo B. “Nenhum A é B” = círculos separados. “Algum A é B” = círculos que se cruzam. Com o desenho, a resposta costuma aparecer sozinha.'],
 ['Procure um contraexemplo','Para mostrar que um argumento é <b>inválido</b>, tente desenhar uma situação em que as premissas são verdadeiras e a conclusão é falsa. Se conseguir, a conclusão não é obrigatória.',['“Todo bancário estuda. Lia estuda. Logo, Lia é bancária.” Válido?','Inválido: Lia pode estar no círculo dos que estudam, mas fora dos bancários.']],
 ['Dois esquemas que sempre caem','<b>Modus ponens</b>: Se p, então q. p aconteceu. Logo, q. ✓<br><b>Modus tollens</b>: Se p, então q. q não aconteceu. Logo, p não aconteceu. ✓<br>Cuidado: “q aconteceu, logo p” é <b>inválido</b>.']]},
'log-3':{oi:'Esses problemas são quebra-cabeças de detetive. A ferramenta é uma tabela, e a regra é: anote tudo.',s:[
 ['Monte a grade','Coloque pessoas nas linhas e opções nas colunas. Cada pista vira um ✘ (não pode) ou um ✔ (é isso). Quando uma linha tiver tudo ✘ menos uma casa, essa casa é ✔.'],
 ['Comece pelas pistas diretas','Pistas como “Léo trabalha na loja” valem ouro: marque ✔ e já ponha ✘ no resto da linha e da coluna, porque ninguém mais trabalha na loja.'],
 ['Depois, por eliminação','“Rui não trabalha na escola.” Se Rui também não está na loja (que é de Léo), sobra o banco. Cada ✔ gera novos ✘. Siga até preencher tudo.'],
 ['Pratique na grade','Logo abaixo tem uma grade de detetive para você clicar. Leia as pistas e marque ✘ e ✔ até descobrir quem contratou o quê.']]},
'log-4':{oi:'Calendário, relógio e sequências seguem padrões que se repetem. Achou o padrão, achou a resposta.',s:[
 ['Sequência: olhe as diferenças','Em 2, 5, 10, 17, 26… calcule quanto aumenta de um para o outro: +3, +5, +7, +9. As diferenças crescem de 2 em 2, então a próxima é +11: o próximo termo é 37.',['Próximo de 1, 4, 9, 16, …?','25 (são os quadrados: 1², 2², 3², 4², 5²).']],
 ['A semana é uma roda de 7','A cada 7 dias, o dia da semana se repete. Por isso 7, 14 ou 70 dias depois de uma segunda é segunda de novo. Só importa o que <b>sobra</b> quando você divide por 7.'],
 ['Conta do resto','Hoje é segunda. Daqui a 45 dias? 45 ÷ 7 = 6 voltas e sobram 3. Ande 3 casas a partir da segunda: terça, quarta, <b>quinta</b>.',['Hoje é sábado. Que dia será daqui a 30 dias?','Segunda-feira. 30 = 4 × 7 + 2; sábado + 2 = segunda.']],
 ['Relógio: os ponteiros andam juntos','O ponteiro dos minutos anda 6° por minuto (360° ÷ 60). O das horas anda 30° por hora, ou 0,5° por minuto. Às 2h30, o das horas não está no 2: está no meio entre o 2 e o 3.']]},
'cont-0':{oi:'Contar possibilidades é como montar looks. Se você já combinou roupa, já fez análise combinatória.',s:[
 ['Uma escolha depois da outra','Você tem 3 camisas e 2 calças. Para cada camisa, há 2 calças possíveis. São 3 grupos de 2: 3 × 2 = <b>6</b> looks. Quando as escolhas acontecem juntas (uma <b>e</b> outra), multiplique.'],
 ['Desenhe os tracinhos','Para senhas, desenhe um tracinho por posição e escreva quantas opções cabem em cada um: senha de 3 dígitos = __ × __ × __ = 10 × 10 × 10 = 1.000.',['Código com 2 letras (26 opções cada) seguidas de 1 dígito: quantos?','26 × 26 × 10 = 6.760.']],
 ['Sem repetir, diminui','Se os dígitos não podem repetir, cada tracinho tem uma opção a menos que o anterior: 10 × 9 × 8 = 720.'],
 ['“Ou” soma','Se você vai escolher <b>um</b> lanche entre 4 salgados <b>ou</b> 3 doces, são 4 + 3 = 7 opções. Grupos separados, escolhendo só um: some.']]},
'cont-1':{oi:'Fatorial tem ponto de exclamação porque cresce de um jeito espantoso!',s:[
 ['O que é n!','<span class="f">5! = 5 × 4 × 3 × 2 × 1 = 120</span>. É a multiplicação de todos os inteiros de n até 1. Por convenção, 0! = 1.',['Quanto é 4!?','24.']],
 ['Permutar é organizar uma fila','De quantos jeitos 3 amigos fazem uma fila? 1º lugar: 3 opções; 2º: 2; 3º: 1. Total: 3 × 2 × 1 = 3! = 6. Fila de n pessoas: n!.'],
 ['Anagrama é fila de letras','Anagramas de AMOR: 4 letras diferentes → 4! = 24. Cada fila de letras é um anagrama, faça sentido ou não.'],
 ['Letras repetidas','Em ARARA, trocar um A com outro A não cria anagrama novo. Divida pelos fatoriais das repetições: 5! ÷ (3! × 2!) = 120 ÷ 12 = <b>10</b>.',['Anagramas de OVO?','3! ÷ 2! = 3 (OVO, VOO, OOV).']],
 ['Corte o fatorial','Para calcular 8! ÷ 6!, não multiplique tudo: 8! = 8 × 7 × 6!. Corta o 6! e sobra 8 × 7 = 56.']]},
'cont-2':{oi:'A única pergunta que importa aqui: a ordem muda alguma coisa?',s:[
 ['Pódio × comissão','Escolher 1º, 2º e 3º lugar: trocar as pessoas de posição muda o pódio → <b>ordem importa</b> (arranjo). Escolher 3 pessoas para uma comissão: trocar a ordem não muda nada, é o mesmo grupo → <b>ordem não importa</b> (combinação).'],
 ['Arranjo: tracinhos','Pódio com 5 corredores: 5 × 4 × 3 = 60 resultados possíveis.'],
 ['Combinação: tire as repetições','Na comissão, o grupo {Ana, Beto, Caio} apareceu 6 vezes no cálculo do pódio (3! ordens). Então divida: 60 ÷ 6 = <b>10</b> comissões.',['De 6 pessoas, quantas duplas?','(6 × 5) ÷ 2 = 15.']],
 ['Teste da troca','Na dúvida, escolha duas pessoas e troque de lugar. Mudou o resultado (cargo diferente, ordem de chegada)? Arranjo. Ficou igual (time, grupo, aperto de mão)? Combinação.']]},
'cont-3':{oi:'Probabilidade mede a chance. É uma fração: o que eu quero dividido por tudo que pode acontecer.',s:[
 ['Favoráveis ÷ possíveis','Num dado, a chance de sair 5 é 1 (o que eu quero) em 6 (o que pode sair): 1/6. A chance de sair mais que 4 (5 ou 6) é 2/6 = 1/3.',['Numa urna com 3 bolas azuis e 7 vermelhas, P(azul)?','3/10 = 30%.']],
 ['Sempre de 0 a 1','Probabilidade 0 = impossível; 1 = certeza. Tudo fica entre 0 e 1 (ou 0% e 100%). Se deu 1,2 na sua conta, algo está errado.'],
 ['O que falta','P(não acontecer) = 1 − P(acontecer). Se a chance de chover é 30%, a de não chover é 70%.'],
 ['“E” multiplica','Duas moedas: P(cara e cara) = 1/2 × 1/2 = 1/4. Eventos independentes acontecendo juntos: multiplique as chances.'],
 ['“Pelo menos um”: use o contrário','P(pelo menos uma cara em 3 moedas) = 1 − P(nenhuma cara) = 1 − 1/8 = 7/8. Muito mais rápido que listar os casos.']]},
'cont-4':{oi:'Probabilidade condicional é quando você já sabe de alguma coisa e isso muda a chance. O truque é pensar em pessoas, não em porcentagens.',s:[
 ['O universo encolhe','“Entre os clientes com cartão, qual a chance de ter investimento?” Você não olha mais todos os clientes: só os que têm cartão. Esse grupo vira o seu novo “todo”.'],
 ['Imagine 100 pessoas','Porcentagens confundem. Transforme em pessoas: 60% têm cartão = 60 pessoas. 40% delas investem = 24 pessoas. Fica concreto e fácil de dividir.'],
 ['A fórmula em palavras','<span class="f">P(A | B) = P(A e B) ÷ P(B)</span>. Lê-se: “chance de A sabendo que B” = os que têm as duas coisas ÷ os que têm B.',['Dos 50 clientes que investem, 20 têm seguro. Sabendo que o cliente investe, P(seguro)?','20/50 = 2/5 = 40%.']],
 ['Use a árvore','Cada galho recebe uma chance. Multiplique ao longo do caminho para achar “isso e aquilo”. Some os caminhos que levam ao que você quer. O laboratório abaixo faz isso com 100 bonequinhos.']]},
'est-0':{oi:'Estatística começa por uma pergunta: vou olhar todo mundo ou só um pedaço?',s:[
 ['População é todo mundo','Todos os clientes do banco formam a <b>população</b>. Perguntar a cada um seria caro e demorado.'],
 ['Amostra é um pedaço que representa','Escolhemos 500 clientes para responder a pesquisa: essa é a <b>amostra</b>. É como provar uma colher de sopa para saber o sabor da panela: se a sopa estiver bem mexida, a colher representa tudo.'],
 ['Formas de sortear','<b>Aleatória simples</b>: todos têm a mesma chance. <b>Sistemática</b>: um a cada k da lista. <b>Estratificada</b>: divide em grupos (PF e PJ) e sorteia de cada um na proporção. <b>Por conglomerados</b>: sorteia grupos inteiros (agências).',['Sortearam 3 agências e entrevistaram todos os clientes delas. Que amostragem é essa?','Por conglomerados.']],
 ['Tipos de variável','Qualitativa: categorias (estado civil, cor). Quantitativa: números. <b>Discreta</b> se conta (nº de filhos); <b>contínua</b> se mede (altura, renda).']]},
'est-1':{oi:'Gráfico é um desenho que conta uma história com números. Vamos aprender a ler e a montar.',s:[
 ['Frequência absoluta e relativa','Absoluta: quantas vezes apareceu (12 clientes). Relativa: que parte do total é (12 de 60 = 20%). A soma das relativas sempre dá 100%.'],
 ['Barras comparam','Cada barra é uma categoria; a altura mostra a quantidade. Ótimo para comparar categorias lado a lado.'],
 ['Pizza mostra a parte do todo','Cada fatia é uma porcentagem do círculo. Para achar o ângulo: % × 360°. 25% → 90° (um quarto da pizza).',['Uma fatia de 20% tem quantos graus?','72°. 0,2 × 360.']],
 ['Linha mostra o tempo','Gráfico de linha mostra evolução: saldo mês a mês, inflação ao longo do ano. Histograma parece de barras, mas é para faixas de valores numéricos, com as barras coladas.']]},
'est-2':{oi:'Média, mediana e moda são três jeitos de responder à mesma pergunta: qual é o valor típico?',s:[
 ['Média: dividir igualmente','Três amigos têm R$ 10, R$ 20 e R$ 60. Se juntarem tudo e repartirem igual, cada um fica com (10 + 20 + 60) ÷ 3 = R$ 30. Essa é a <b>média</b>.'],
 ['Mediana: o do meio da fila','Coloque os valores em ordem e pegue o do meio: 10, <b>20</b>, 60 → mediana 20. Se a quantidade for par, faça a média dos dois do meio.',['Mediana de 7, 1, 4, 9?','5,5. Ordenando: 1, 4, 7, 9 → (4 + 7) ÷ 2.']],
 ['Moda: o que está na moda','É o valor que mais aparece. Em 2, 3, 3, 3, 8, a moda é 3. Pode não haver moda ou haver mais de uma.'],
 ['Qual delas é mais justa?','Um milionário entra num bar com 9 pessoas comuns: a média de renda dispara, mas a mediana quase não muda. Por isso renda costuma ser descrita pela mediana.'],
 ['Média ponderada: cada um com seu peso','Na prova do Banestes, Específicos têm peso 2. Nota 6 em Gerais e 8 em Específicos: (6 × 1 + 8 × 2) ÷ 3 = 22 ÷ 3 ≈ 7,33. Multiplique cada valor pelo peso e divida pela soma dos pesos.']]},
'est-3':{oi:'Dois grupos podem ter a mesma média e ser muito diferentes. Dispersão mede o quanto os dados se espalham.',s:[
 ['Mesma média, histórias diferentes','Agência A: espera de 9, 10 e 11 min. Agência B: 1, 10 e 19 min. Média 10 nas duas, mas na B a espera é imprevisível. A dispersão da B é maior.'],
 ['Amplitude: a mais simples','Maior − menor. A: 11 − 9 = 2. B: 19 − 1 = 18. Rápida, mas só olha os extremos.'],
 ['Variância: média dos quadrados dos desvios','Desvio é a distância até a média. Na B: −9, 0, +9. Elevamos ao quadrado (81, 0, 81) para o sinal não atrapalhar e tiramos a média: 162 ÷ 3 = 54.',['Variância de 4, 6, 8 (média 6)?','(4 + 0 + 4) ÷ 3 = 8/3 ≈ 2,67.']],
 ['Desvio padrão volta à unidade','A variância fica em “minutos ao quadrado”, o que é estranho. Tire a raiz: desvio padrão = √54 ≈ 7,3 min. Agora dá para comparar com os dados.'],
 ['Coeficiente de variação','CV = desvio ÷ média. Serve para comparar grupos com médias diferentes. Uma referência comum: até 15%, dados homogêneos; acima de 30%, bem dispersos.']]},
'est-4':{oi:'A curva normal é o famoso sino. Muita coisa na natureza e no banco se distribui assim.',s:[
 ['O sino','A maioria dos valores fica perto da média, e cada vez menos valores aparecem conforme nos afastamos. A curva é simétrica: média, mediana e moda coincidem no centro.'],
 ['Regra 68–95–99,7','A até 1 desvio padrão da média ficam ~68% dos dados; até 2 desvios, ~95%; até 3, ~99,7%.',['Média 100, desvio 10. Que % fica entre 80 e 120?','≈ 95% (dois desvios para cada lado).']],
 ['Escore z: quantos desvios?','z = (valor − média) ÷ desvio. Nota 85 numa prova de média 70 e desvio 10: z = 1,5. O candidato está 1,5 desvio acima da média.'],
 ['Números-índice','Comparam com uma base que vale 100. Se o preço foi de 50 para 60, o índice é 60 ÷ 50 × 100 = 120: subiu 20%.']]},
'fin-0':{oi:'Juros são o aluguel do dinheiro. Quem empresta cobra; quem aplica recebe.',s:[
 ['Os personagens','<b>C</b> = capital (quanto você aplicou). <b>i</b> = taxa (quanto rende por período). <b>t</b> = tempo. <b>J</b> = juros (o que rendeu). <b>M</b> = montante (tudo junto: C + J).'],
 ['Simples = sempre sobre o mesmo valor','Nos juros simples, a taxa incide <b>sempre sobre o capital inicial</b>. R$ 1.000 a 2% ao mês rende R$ 20 todo mês, sem mudar. Em 5 meses: 5 × 20 = R$ 100.'],
 ['A fórmula é só isso','<span class="f">J = C × i × t</span>, com i em decimal (2% = 0,02). J = 1.000 × 0,02 × 5 = 100. M = 1.000 + 100 = R$ 1.100.',['R$ 500 a 3% ao mês por 4 meses: quanto de juros?','R$ 60. 500 × 0,03 × 4.']],
 ['Taxa e tempo na mesma unidade','Taxa ao mês com tempo em meses; ao ano com tempo em anos. Se a taxa é 24% ao ano e o prazo é 3 meses, use 2% ao mês (24 ÷ 12) × 3 meses.']]},
'fin-1':{oi:'Juros compostos são juros sobre juros: a bola de neve do dinheiro.',s:[
 ['Rende sobre o que já rendeu','R$ 1.000 a 10% ao mês. Mês 1: rende 100 → 1.100. Mês 2: rende 10% de <b>1.100</b> = 110 → 1.210. Os juros entram no saldo e passam a render também.'],
 ['Fator de novo','Cada mês, multiplique por 1,10. Em 2 meses: 1.000 × 1,1 × 1,1 = 1.000 × 1,1² = 1.210. Daí a fórmula <span class="f">M = C × (1 + i)ⁿ</span>.',['R$ 2.000 a 10% ao mês por 2 meses?','2.000 × 1,21 = R$ 2.420.']],
 ['Simples × compostos','No 1º período, os dois dão o mesmo. Depois, o composto sempre ganha. A diferença cresce com o tempo: é a curva que “descola” da reta.'],
 ['Regra do 72','Para saber em quanto tempo o dinheiro dobra: 72 ÷ taxa. A 6% ao ano, dobra em cerca de 12 anos.']]},
'fin-2':{oi:'Taxas têm vários sobrenomes: nominal, efetiva, proporcional, equivalente. Vamos dar um rosto para cada uma.',s:[
 ['Proporcional (simples)','Basta dividir ou multiplicar: 12% ao ano ↔ 1% ao mês. Vale nos juros simples.'],
 ['Equivalente (composta)','No regime composto, 1% ao mês <b>não</b> é 12% ao ano: 1,01¹² ≈ 1,1268 → 12,68% ao ano. Taxas equivalentes levam ao mesmo montante no mesmo prazo.',['10% ao mês equivale a quanto ao bimestre (composto)?','21%. 1,1² = 1,21.']],
 ['Nominal é “de fachada”','“12% ao ano capitalizados mensalmente” é taxa nominal: o período da taxa (ano) é diferente do da capitalização (mês). Divida pelo número de capitalizações (1% ao mês): essa é a taxa efetiva mensal.'],
 ['Real desconta a inflação','Rendeu 10% e a inflação foi 4%: o ganho real não é 6%. É 1,10 ÷ 1,04 ≈ 1,0577 → ≈ 5,77%.']]},
'fin-3':{oi:'Desconto é antecipar um pagamento: você recebe hoje um valor menor do que receberia no vencimento.',s:[
 ['Os personagens','<b>N</b> = valor nominal (o que vale no vencimento). <b>A</b> = valor atual (o que você recebe hoje). <b>D</b> = desconto = N − A.'],
 ['Comercial (por fora)','Calcula a taxa sobre o <b>N</b>: D = N × i × t. Título de R$ 10.000, 2% ao mês, 3 meses: D = 600 e A = 9.400. É o mais usado pelos bancos.',['N = 5.000, i = 3% ao mês, t = 2 meses. Desconto comercial?','R$ 300.']],
 ['Racional (por dentro)','Calcula a taxa sobre o <b>A</b>: A = N ÷ (1 + i × t). Com os mesmos números: 10.000 ÷ 1,06 ≈ 9.433,96. O desconto racional é sempre <b>menor</b> que o comercial.'],
 ['Composto','Racional composto: A = N ÷ (1 + i)ⁿ. É o mesmo que trazer o dinheiro a valor presente.']]},
'fin-4':{oi:'Dinheiro tem endereço no tempo. R$ 100 hoje não valem o mesmo que R$ 100 daqui a um ano.',s:[
 ['Para o futuro: multiplica','Levar um valor para frente é aplicar juros: VF = VP × (1 + i)ⁿ.'],
 ['Para o passado: divide','Trazer um valor do futuro para hoje é retirar os juros: VP = VF ÷ (1 + i)ⁿ.',['Quanto vale hoje R$ 1.210 a receber em 2 meses, com 10% ao mês?','R$ 1.000. 1.210 ÷ 1,21.']],
 ['Só compare na mesma data','Para comparar propostas (à vista × parcelado), leve tudo para a mesma data. Não some valores de datas diferentes sem antes trazê-los para o mesmo ponto.'],
 ['Equivalência de capitais','Dois pagamentos são equivalentes se, levados à mesma data, têm o mesmo valor. É a base para renegociar dívidas.']]},
'fin-5':{oi:'Financiamento é uma série de parcelas. Cada parcela tem dois pedaços: juros e amortização.',s:[

/* ---------- confete ---------- */
function confetti(anchor){
 try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
 const r=anchor&&anchor.getBoundingClientRect?anchor.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
 const cx=r.left+r.width/2,cy=r.top+r.height/2,C=['#F5C04E','#1257B0','#1D8455','#E4572E','#7A4BC4','#36C2B2'];
 for(let k=0;k<24;k++){const s=document.createElement('span');s.className='cf';const a=Math.random()*Math.PI*2,d=60+Math.random()*90;
  s.style.cssText=`left:${cx}px;top:${cy}px;background:${C[k%C.length]};--dx:${(Math.cos(a)*d).toFixed(0)}px;--dy:${(Math.sin(a)*d-40).toFixed(0)}px;--rot:${Math.round(Math.random()*720-360)}deg`;
  document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}

/* ---------- explicação do zero, passo a passo ---------- */
function zeroInit(el,d){
 let shown=1;const N=d.s.length;
 const card=(s,k)=>`<div class="zstep"><p class="zn">Passo ${k+1} de ${N}</p><h3>${s[0]}</h3><p>${s[1]}</p>${s[2]?`<div class="zcheck"><p><b>🤔 Pense rápido:</b> ${s[2][0]}</p><button class="btn small ghost" data-zr>Ver resposta</button><p class="zans" hidden>${s[2][1]}</p></div>`:''}</div>`;
 const draw=()=>{el.innerHTML=fala('feliz',d.oi)+`<div class="zlist">${d.s.slice(0,shown).map(card).join('')}</div>
  <div class="zdots" aria-hidden="true">${d.s.map((_,k)=>`<i class="${k<shown?'on':''}"></i>`).join('')}</div>
  ${shown<N?`<div class="cta"><button class="btn" data-zn>Entendi! Próximo passo →</button><button class="btn small ghost" data-za>Mostrar tudo</button></div>`:fala('uau','Pronto, você já tem a base! Agora a explicação completa, os laboratórios e os exemplos ficam muito mais fáceis. Vamos?','end')}`;
  el.querySelectorAll('[data-zr]').forEach(b=>b.onclick=()=>{b.nextElementSibling.hidden=false;b.remove()});
  const n=el.querySelector('[data-zn]');if(n)n.onclick=()=>{shown++;draw();const st=el.querySelectorAll('.zstep');st[st.length-1].scrollIntoView({behavior:'smooth',block:'nearest'})};
  const a=el.querySelector('[data-za]');if(a)a.onclick=()=>{shown=N;draw()}};
 draw()}

function parseNum(x){if(x==='')return NaN;if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(x))x=x.replace(/\./g,'').replace(',','.');else x=x.replace(',','.');return Number(x)}
function parseAns(s,frac){s=String(s).trim().replace(/R\$|\s/g,'').replace(/[−–]/g,'-');let pct=false;if(s.endsWith('%')){pct=true;s=s.slice(0,-1)}
 let v;if(s.includes('/')){const[a,b]=s.split('/').map(parseNum);v=b?a/b:NaN}else v=parseNum(s);if(pct&&frac)v/=100;return v}
let TRS=0;
function treinoInit(el,key){
 let G,tries=0;
 const nova=()=>{G=GEN[key]();tries=0;
  el.innerHTML=`<div class="trhead"><p class="eyebrow">Treino sem fim · uma questão nova a cada clique</p><span class="pill" title="Acertos seguidos">🔥 <span class="num">${TRS}</span> seguidas</span></div>
  <p class="qtext" style="font-size:17px">${G.q}</p>
  ${G.k==='mc'?`<div class="opts">${G.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="L">${'ABCDEFG'[k]}</span><span>${o}</span></button>`).join('')}</div>`
   :`<div class="trrow"><input class="trin" inputmode="decimal" autocomplete="off" placeholder="Sua resposta" aria-label="Sua resposta"><button class="btn" data-ok>Conferir</button></div><p class="muted" style="font-size:13px">${G.un?'Responda em: '+G.un+' · ':''}use vírgula para decimais${G.k==='frac'?' · pode digitar fração, como 3/4':''}</p>`}
  <div class="trfb"></div><div class="cta"><button class="btn small ghost" data-h>💡 Dica do Jon</button><button class="btn small ghost" data-s>Ver solução</button><button class="btn small" data-n>Nova questão ↻</button></div><div class="trx"></div>`;
  const q=s=>el.querySelector(s),fb=q('.trfb'),x=q('.trx');
  const showSol=()=>{x.innerHTML=`<div class="trsol"><p class="eyebrow">Como resolver</p><ol>${G.sol.map(s=>`<li>${s}</li>`).join('')}</ol><p><b>Resposta:</b> ${G.k==='mc'?G.opts[G.ans]:G.show?G.show+' ≈ '+nf(G.ans):nf(G.ans)}</p></div>`};
  const hint=()=>{if(!x.querySelector('.trhint'))x.insertAdjacentHTML('afterbegin',`<div class="trhint">${fala('pensa',G.dica,'sm')}</div>`)};
  const result=(ok,btn)=>{if(ok){TRS++;ST.xp+=2;tick();save();hdr();confetti(btn);fb.innerHTML=`<div class="fb ok">${fala('feliz',`<b>${pick(YAY)}</b> +2 moedas · ${TRS} seguida${TRS>1?'s':''} 🔥`,'sm')}</div>`;showSol();
    el.querySelectorAll('.opt,.trin,[data-ok]').forEach(e=>e.disabled=true);q('[data-n]').focus()}
   else{tries++;TRS=0;el.querySelector('.pill .num').textContent=0;if(tries===1){fb.innerHTML=`<div class="fb no">${fala('pensa',`<b>${pick(NAH)}</b> Olha a dica e tenta mais uma vez.`,'sm')}</div>`;hint()}
    else{fb.innerHTML=`<div class="fb no">${fala('pensa','<b>Vamos ver juntos como resolve.</b> Depois tente uma nova questão do mesmo tipo.','sm')}</div>`;showSol();el.querySelectorAll('.opt,.trin,[data-ok]').forEach(e=>e.disabled=true)}}};
  if(G.k==='mc')el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,ok=k===G.ans;if(ok)b.classList.add('right');else{b.classList.add('wrong');b.disabled=true}result(ok,b);if(ok||tries>=2)el.querySelectorAll('.opt').forEach(o=>{if(+o.dataset.k===G.ans)o.classList.add('right')})});
  else{const inp=q('.trin'),chk=()=>{const v=parseAns(inp.value,G.k==='frac');if(isNaN(v)){fb.innerHTML=`<div class="fb no">${fala('pensa','Digite um número, por favor. Exemplos: 40 · 12,5 · −30'+(G.k==='frac'?' · 3/4':''),'sm')}</div>`;return}
    const tol=G.k==='frac'?0.006:(G.tol!=null?G.tol:(Number.isInteger(G.ans)?0.001:0.011));result(Math.abs(v-G.ans)<=tol+1e-9,q('[data-ok]'))};
   q('[data-ok]').onclick=chk;inp.addEventListener('keydown',e=>{if(e.key==='Enter')chk()})}
  q('[data-h]').onclick=hint;q('[data-s]').onclick=()=>{showSol();if(!fb.innerHTML)fb.innerHTML=''};q('[data-n]').onclick=()=>{nova();const t=el.querySelector('.trin');if(t)t.focus({preventScroll:true})}};
 nova()}

function readMin(a){const txt=[a.g,...a.b.flat(),...a.x.flat(2),a.c,a.p,...(DEV[a._k]?DEV[a._k].s.flat(2):[])].join(' ');return Math.max(3,Math.round(strip(txt).split(/\s+/).length/150))}

function recomenda(){
  for(const m of MODS){const wp=weakPre(m.id);if(wp.length)return wp[0]}
  let best=null,sc=99;MODS.forEach(m=>{const s=ST.m[m.id];const v=s.st.filter(x=>x>=2).length;if(v<3&&v<sc){sc=v;best=m.id}});return best;
}
function motivo(id){const s=ST.m[id];if(s.un===1)return 'Você ainda está no nível Base aqui. Comece pelas aulas e depois faça o N1.';const n=s.st.findIndex((x,i)=>i<s.un&&x<2);return n>=0?`Faltam estrelas no ${LV[n]}. Refaça para firmar a base.`:`Você liberou até o ${LV[s.un-1]}. Siga em frente.`}

   ${a.gen?`<h2>Agora é sua vez</h2><section class="treino" id="treino"></section>`:''}

   <aside class="trapbox"><p class="eyebrow">Pegadinha da banca</p><p>${a.p}</p></aside>
   <section class="panel"><p class="eyebrow">Teste rápido · não vale nota</p><p class="qtext" style="font-size:17px">${a.q[0]}</p><div class="opts">${a.q[1].map((o,k)=>`<button class="opt" data-k="${k}"><span class="L">${'ABC'[k]}</span><span>${o}</span></button>`).join('')}</div><div id="mfb"></div></section>

   <nav class="lnav">${i>0?`<button class="btn ghost small" id="prev">← Aula anterior</button>`:'<span></span>'}<button class="btn" id="done">${done?(last?'Ir para os exercícios →':'Próxima aula →'):(last?'Concluir e praticar (+5) →':'Concluir e seguir (+5) →')}</button></nav>

    $('#mfb').innerHTML=`<div class="fb ${hit?'ok':'no'}" style="margin-top:10px">${fala(hit?'feliz':'pensa',`<b>${hit?pick(YAY):pick(NAH)}</b>`,'sm')}<p>${a.q[3]}</p></div>`;if(hit)confetti(b)});
  a.labs.forEach((l,k)=>LAB[l].init($('#lab'+k)));
  if(a.dev)zeroInit($('#zero'),a.dev);
  if(a.gen)treinoInit($('#treino'),a.gen);
  $('#done').onclick=()=>{if(!done){ST.aulas[key]=1;ST.xp+=5;tick();save();hdr()}if(last)modulo(mid,'e');else aula(mid,i+1)};

}

/* ---------- quiz ---------- */
let QZ=null;
function startLevel(m,l){QZ={mode:'lv',mod:m,lv:l,qs:MOD[m].niveis[l].map((_,i)=>getQ(qid(m,l,i))),i:0,ok:0,res:[]};showQ()}
function startDiag(){const qs=[];MODS.forEach(m=>{qs.push(getQ(qid(m.id,1,0)),getQ(qid(m.id,2,0)))});QZ={mode:'diag',qs,i:0,ok:0,res:[]};showQ()}
function startErros(){QZ={mode:'err',qs:shuffle(ST.erros).slice(0,8).map(getQ),i:0,ok:0,res:[]};showQ()}
function showQ(){
  const z=QZ,Q=z.qs[z.i],m=MOD[Q.mod];const order=shuffle([0,1,2,3,4]);z.order=order;
  const title=z.mode==='diag'?'Nivelamento':z.mode==='err'?'Caderno de erros':`${m.nome} · ${LV[z.lv]}`;
  app.innerHTML=`<button class="back" id="quit">← Sair</button>
   <section class="qhead" style="--mc:var(${m.c})"><p class="eyebrow">${title} · questão ${z.i+1} de ${z.qs.length}</p><div class="bar"><i style="width:${z.i/z.qs.length*100}%"></i></div>
   ${z.mode!=='lv'?`<span class="tag mc" style="justify-self:start">${m.nome}</span>`:''}</section>
   <p class="qtext">${Q.t}</p>
   <div class="opts" style="--mc:var(${m.c})">${order.map((k,j)=>`<button class="opt" data-k="${k}"><span class="L">${'ABCDE'[j]}</span><span>${Q.o[k]}</span></button>`).join('')}</div>
   <div id="fb"></div>`;
  $('#quit').onclick=home;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  window.scrollTo(0,0);
}
function answer(k){
  const z=QZ,Q=z.qs[z.i],hit=k===Q.a;tick();
  app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const kk=+b.dataset.k;if(kk===Q.a)b.classList.add('right');else if(kk===k)b.classList.add('wrong')});
  if(hit){z.ok++;ST.xp+=10;ST.erros=ST.erros.filter(e=>e!==Q.id)}else if(!ST.erros.includes(Q.id))ST.erros.push(Q.id);
  z.res.push({id:Q.id,hit});save();hdr();
  const last=z.i===z.qs.length-1;
  $('#fb').innerHTML=`<div class="fb ${hit?'ok':'no'}">${fala(hit?'feliz':'pensa',`<b>${hit?pick(YAY)+' +10 moedas':pick(NAH)}</b>`,'sm')}<p>${Q.e}</p></div><div style="margin-top:12px"><button class="btn" id="next">${last?'Ver resultado':'Próxima →'}</button></div>`;
  if(hit)confetti(app.querySelector('.opt.right'));
  $('#next').onclick=()=>{if(last)finish();else{z.i++;showQ()}};$('#next').focus();
}
function finish(){
  const z=QZ,n=z.qs.length,pct=z.ok/n;let h=`<section class="res">`;
  if(z.mode==='lv'){
    const m=MOD[z.mod],s=ST.m[z.mod],st=z.ok===4?3:z.ok===3?2:z.ok===2?1:0;s.tent[z.lv]++;s.st[z.lv]=Math.max(s.st[z.lv],st);
    const pass=z.ok>=3;if(pass&&s.un<z.lv+2&&z.lv<2)s.un=z.lv+2;if(pass)ST.xp+=20;save();hdr();
    h+=`<p class="eyebrow">${m.nome} · ${LV[z.lv]}</p><div class="big">${z.ok}/${n}</div><span class="stars" style="font-size:28px">${stars(st)}</span>`;
    if(pass)h+=`<div class="panel"><h3>${z.lv<2?'Nível liberado: '+LV[z.lv+1]:'Módulo dominado no nível de prova'}</h3><p class="muted">+20 moedas de bônus. ${z.lv<2?'Siga subindo enquanto o conteúdo está fresco.':'Agora treine com provas anteriores ou siga para outra estação.'}</p></div>`;
    else{const pre=m.pre.map(p=>MOD[p]);
      h+=`<div class="panel recomp"><p class="eyebrow">Recomposição</p><h3>Antes de tentar de novo</h3><p>${z.ok<=1?'O resultado indica falta de base. ':''}Releia os conceitos deste módulo${z.lv>0?` e refaça o nível ${LV[z.lv-1]}`:''}${pre.length&&z.ok<=1?`. Este assunto depende de ${pre.map(p=>`<b>${p.nome}</b>`).join(' e ')}`:''}.</p>
        ${(()=>{const un=AULAS[z.mod].map((a,i)=>[a,i]).filter(([a,i])=>!ST.aulas[z.mod+'-'+i]);return un.length?`<p style="font-size:14px"><b>Aulas deste módulo que você ainda não estudou:</b></p><div class="cta">${un.map(([a,i])=>`<button class="btn small ghost" data-aula="${i}">${i+1}. ${a.t}</button>`).join('')}</div>`:''})()}
        <div class="cta"><button class="btn small" id="toC">Rever aulas</button>${z.lv>0?`<button class="btn small ghost" id="prevLv">Refazer ${LV[z.lv-1]}</button>`:''}${pre.length&&z.ok<=1?pre.map(p=>`<button class="btn small ghost" data-open="${p.id}">${p.nome}</button>`).join(''):''}</div></div>`}
    h+=`<div class="cta"><button class="btn ghost" id="again">Refazer este nível</button><button class="btn ghost" id="toMod">Voltar ao módulo</button></div>`;
  }else if(z.mode==='diag'){
    const per={};z.res.forEach(r=>{const md=r.id.split('-')[0];per[md]=(per[md]||0)+(r.hit?1:0)});
    MODS.forEach(m=>{const a=per[m.id]||0,s=ST.m[m.id];s.un=Math.max(s.un,a+1)});ST.diag={data:today(),per};save();
    h+=`<p class="eyebrow">Resultado do nivelamento</p><div class="big">${z.ok}/${n}</div><p class="muted">Cada módulo teve uma questão intermediária e uma de nível prova. Seu ponto de partida em cada um:</p>
     <div class="levels">${MODS.map(m=>{const a=per[m.id]||0;return `<div class="lvl" style="--mc:var(${m.c})"><div><h3>${m.nome}</h3><span class="muted" style="font-size:14px">${a}/2 acertos</span></div><span class="tag mc">começa em ${LV[a]}</span></div>`}).join('')}</div>
     <p class="muted">Os níveis abaixo do seu ponto de partida ficam abertos para revisão. Módulos marcados com recomposição pedem reforço da base primeiro.</p>`;
    h+=`<div class="cta"><button class="btn" id="home2">Ver minha trilha</button></div>`;
  }else{
    h+=`<p class="eyebrow">Caderno de erros</p><div class="big">${z.ok}/${n}</div><p class="muted">Questões acertadas saem do caderno. ${ST.erros.length?`Ainda restam ${ST.erros.length}.`:'Caderno zerado.'}</p><div class="cta"><button class="btn" id="home2">Voltar à trilha</button></div>`;
  }
  app.innerHTML=h+`</section>`;
  const on=(s,f)=>{const e=$(s);if(e)e.onclick=f};
  on('#again',()=>startLevel(z.mod,z.lv));on('#toMod',()=>modulo(z.mod,'e'));on('#toC',()=>modulo(z.mod,'a'));app.querySelectorAll('[data-aula]').forEach(b=>b.onclick=()=>aula(z.mod,+b.dataset.aula));on('#prevLv',()=>startLevel(z.mod,z.lv-1));on('#home2',home);
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>modulo(b.dataset.open,'a'));
  window.scrollTo(0,0);
}
home();
</script>

</body></html>
