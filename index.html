const A=(t,v,g,b,x,c,p,q,r,lab)=>({t,v,g,b,x,c,p,q,r,lab});
const AULAS={
num:[
A('Inteiros e racionais: a matemática do saldo','reta',
 'Seu Jorge tinha R$ 200 na conta e pagou um boleto de R$ 350. O app mostra o saldo em vermelho. Quanto? A reta numérica responde: 200 − 350 = −150.',
 [['Quem é quem','<b>Naturais (ℕ)</b>: 0, 1, 2, 3… servem para contar.<br><b>Inteiros (ℤ)</b>: os naturais e seus opostos (…, −2, −1, 0, 1, 2…). Pense em saldo positivo e negativo.<br><b>Racionais (ℚ)</b>: tudo que pode ser escrito como fração a/b, com b ≠ 0. Inclui decimais exatos (0,25 = 1/4) e dízimas periódicas (0,333… = 1/3).'],
  ['Jogo de sinais na soma','Sinais iguais: some e repita o sinal (−3 − 5 = −8). Sinais diferentes: subtraia e fique com o sinal de quem tem o maior módulo (−9 + 4 = −5). Pense em dinheiro: dever 9 e receber 4 ainda deixa você devendo 5.'],
  ['Jogo de sinais na multiplicação e divisão','<b>Sinais iguais dão +, sinais diferentes dão −.</b> (−6) × (−2) = 12; (−12) ÷ 3 = −4. Com vários fatores, conte os negativos: quantidade par, resultado positivo; ímpar, negativo.'],
  ['Módulo, oposto e comparação','Módulo é a distância até o zero: |−7| = 7. O oposto de 7 é −7. Na reta, quanto mais à esquerda, menor o número: −10 < −2, mesmo que 10 seja "maior" que 2.']],
 [['Uma conta começou o dia com R$ 120. Houve um débito de R$ 300, um crédito de R$ 95 e outro débito de R$ 40. Qual o saldo final?',
   ['Escreva tudo com sinal: +120 − 300 + 95 − 40.','Junte os positivos: 120 + 95 = 215.','Junte os negativos: −300 − 40 = −340.','Sinais diferentes: subtraia 340 − 215 = 125 e mantenha o sinal do maior módulo, que é negativo.'],'Saldo de −R$ 125 (no vermelho).'],
  ['Calcule (−4) × (+3) − (−18) ÷ (−6).',
   ['Multiplicação e divisão vêm antes da subtração.','(−4) × (+3) = −12, porque os sinais são diferentes.','(−18) ÷ (−6) = +3, porque os sinais são iguais.','Agora: −12 − (+3) = −12 − 3 = −15.'],'−15']],
 'Na China antiga, há mais de 2 mil anos, contadores usavam varetas vermelhas para valores positivos e pretas para negativos. A contabilidade ocidental adotou a cor oposta, com tinta vermelha para perdas, e daí vem a expressão "ficar no vermelho".',
 'Menos com menos só dá mais na multiplicação e na divisão. Na soma, −5 − 3 = −8, e não +8.',
 ['Qual destes números é o menor?',['−0,5','−2','−1,9'],1,'Na reta, −2 está mais à esquerda. Entre negativos, quanto maior o módulo, menor o número.'],
 ['ℕ ⊂ ℤ ⊂ ℚ: todo natural é inteiro, todo inteiro é racional','Multiplicação e divisão: sinais iguais +, diferentes −','Entre negativos, o de maior módulo é o menor']),
A('Potências e expressões numéricas','ops',
 'Um boato começa com 1 pessoa, e cada pessoa conta para 2 novas a cada hora. Em 10 horas, 2¹⁰ = 1.024 pessoas ficam sabendo. Potência é multiplicação repetida, e cresce rápido.',
 [['O que é potência','<span class="f">aⁿ = a × a × … × a</span> (n vezes). Em 2⁵, o 2 é a base e o 5 é o expoente: 2 × 2 × 2 × 2 × 2 = 32.<br>Casos especiais: a¹ = a; a⁰ = 1 (com a ≠ 0); a⁻ⁿ = 1/aⁿ, então 2⁻³ = 1/8.'],
  ['Propriedades que economizam tempo','<span class="f">aᵐ · aⁿ = aᵐ⁺ⁿ</span> · <span class="f">aᵐ ÷ aⁿ = aᵐ⁻ⁿ</span> · <span class="f">(aᵐ)ⁿ = aᵐ·ⁿ</span> · <span class="f">(a·b)ⁿ = aⁿ·bⁿ</span><br>Exemplo: 2³ · 2⁴ = 2⁷ = 128, sem fazer as duas contas separadas.'],
  ['Sinal e potência','Base negativa com expoente par dá positivo: (−2)⁴ = 16. Com expoente ímpar, fica negativo: (−2)³ = −8. Sem parênteses, o sinal fica de fora da potência: −2⁴ = −16.'],
  ['Ordem das operações','1º parênteses ( ), depois colchetes [ ] e chaves { }, sempre de dentro para fora.<br>2º potências e raízes.<br>3º multiplicações e divisões, na ordem em que aparecem.<br>4º somas e subtrações.']],
 [['Calcule 50 − [ 4 × (3 + 2)² ÷ 10 ] + 2³.',
   ['Parênteses: 3 + 2 = 5.','Potência dentro do colchete: 5² = 25.','Dentro do colchete, da esquerda para a direita: 4 × 25 = 100; 100 ÷ 10 = 10.','Fora do colchete: 2³ = 8.','Agora: 50 − 10 + 8 = 48.'],'48'],
  ['Simplifique (3⁵ · 3²) ÷ 3⁴.',
   ['Mesma base multiplicando: some os expoentes. 3⁵ · 3² = 3⁷.','Mesma base dividindo: subtraia os expoentes. 3⁷ ÷ 3⁴ = 3³.','3³ = 27.'],'27']],
 'Diz a lenda que o inventor do xadrez pediu como prêmio 1 grão de trigo na 1ª casa do tabuleiro, 2 na 2ª, 4 na 3ª, e assim por diante. O total das 64 casas é 2⁶⁴ − 1, mais de 18 quintilhões de grãos: mais trigo do que a humanidade já colheu.',
 'Divisão não tem prioridade sobre multiplicação: faça na ordem em que aparecem. 12 ÷ 3 × 2 = 4 × 2 = 8, e não 12 ÷ 6 = 2.',
 ['Quanto vale −3² + (−3)²?',['−18','0','18'],1,'−3² = −9, porque o sinal fica de fora. (−3)² = 9. Soma: 0.'],
 ['aᵐ · aⁿ = aᵐ⁺ⁿ e aᵐ ÷ aⁿ = aᵐ⁻ⁿ','a⁰ = 1 e a⁻ⁿ = 1/aⁿ','Ordem: ( ) → potência → × ÷ → + −']),
A('Múltiplos, divisores e números primos','fatora',
 'O gerente quer distribuir 84 talões em pacotes iguais, sem sobra. Pacotes de 7 servem? E de 8? Com os critérios de divisibilidade, você responde em segundos.',
 [['Múltiplo e divisor','Se a divisão de a por b é exata, então a é <b>múltiplo</b> de b, e b é <b>divisor</b> de a. 84 ÷ 7 = 12, então 84 é múltiplo de 7. Já 84 ÷ 8 deixa resto 4: 8 não é divisor de 84.'],
  ['Critérios de divisibilidade','<b>2</b>: termina em algarismo par.<br><b>3</b>: a soma dos algarismos é divisível por 3.<br><b>4</b>: os dois últimos algarismos formam um múltiplo de 4.<br><b>5</b>: termina em 0 ou 5.<br><b>6</b>: é divisível por 2 e por 3.<br><b>9</b>: a soma dos algarismos é divisível por 9.<br><b>10</b>: termina em 0.'],
  ['Primos e fatoração','Número primo tem exatamente dois divisores: 1 e ele mesmo (2, 3, 5, 7, 11, 13, 17, 19, 23…). O 1 não é primo, e o 2 é o único primo par.<br>Todo número maior que 1 é um produto de primos, de um jeito só: 360 = 2³ · 3² · 5.'],
  ['Quantos divisores?','Na fatoração, some 1 a cada expoente e multiplique os resultados. 360 = 2³ · 3² · 5¹ → (3+1)(2+1)(1+1) = 24 divisores.']],
 [['O número 4.725 é divisível por 3? E por 9? E por 5?',
   ['Some os algarismos: 4 + 7 + 2 + 5 = 18.','18 é divisível por 3 e por 9, então 4.725 também é.','Termina em 5, então é divisível por 5.'],'Sim para os três.'],
  ['Quantos divisores naturais tem o número 72?',
   ['Fatore dividindo pelos primos: 72 ÷ 2 = 36; ÷ 2 = 18; ÷ 2 = 9; ÷ 3 = 3; ÷ 3 = 1.','Logo, 72 = 2³ · 3².','Some 1 a cada expoente: (3+1) e (2+1).','Multiplique: 4 × 3 = 12.'],'12 divisores: 1, 2, 3, 4, 6, 8, 9, 12, 18, 24, 36 e 72.']],
 'A segurança do internet banking depende de números primos. A criptografia RSA multiplica dois primos gigantes, com centenas de algarismos. Multiplicar é rápido; descobrir os dois primos a partir do resultado levaria tempo demais até para supercomputadores.',
 'O 1 não é primo nem composto, e o 2 é primo mesmo sendo par. As bancas adoram listas que incluem o 1 para pegar quem conta rápido.',
 ['Qual destes números é primo?',['51','57','59'],2,'51 = 3 × 17 e 57 = 3 × 19 (somas dos algarismos 6 e 12, divisíveis por 3). O 59 só tem os divisores 1 e 59.'],
 ['Critério do 3 e do 9: some os algarismos','Primo tem exatamente 2 divisores (1 não é primo)','Nº de divisores: multiplique (expoentes + 1)']),
A('MMC e MDC na prática','mmc',
 'Dois caixas eletrônicos passam por manutenção: um a cada 12 dias, o outro a cada 18. Hoje os dois foram revisados juntos. Quando a equipe volta a atender os dois no mesmo dia? A resposta está no MMC.',
 [['MMC: o primeiro reencontro','Mínimo múltiplo comum é o menor número que é múltiplo de todos ao mesmo tempo. Aparece em <b>ciclos, encontros, coincidências</b> e na soma de frações.'],
  ['MDC: o maior pedaço','Máximo divisor comum é o maior número que divide todos ao mesmo tempo. Aparece quando é preciso <b>dividir em partes iguais, do maior tamanho possível</b>, sem sobra.'],
  ['Calculando pela fatoração','Fatore os números.<br><b>MMC</b>: todos os primos que aparecem, cada um com o <b>maior</b> expoente.<br><b>MDC</b>: só os primos comuns, com o <b>menor</b> expoente.<br>12 = 2² · 3 e 18 = 2 · 3² → MMC = 2² · 3² = 36; MDC = 2 · 3 = 6.'],
  ['Atalho valioso','Para dois números, <span class="f">MMC × MDC = a × b</span>. Com 12 e 18: 36 × 6 = 216 = 12 × 18. Achou um, acha o outro com uma divisão.']],
 [['Os caixas da história: manutenção a cada 12 e a cada 18 dias. Se hoje é dia 1º, quando coincidem de novo?',
   ['É um problema de reencontro: MMC.','12 = 2² · 3 e 18 = 2 · 3².','MMC = 2² · 3² = 36 dias.','Some ao dia de hoje: 36 dias depois do dia 1º.'],'Em 36 dias. Num mês de 30 dias, cai no dia 7 do mês seguinte.'],
  ['A agência tem 48 cartilhas de crédito e 72 de investimento. Quer montar kits iguais, com o maior número possível de kits, sem sobrar cartilha. Quantos kits, e o que vai em cada um?',
   ['"Maior número de kits iguais, sem sobra": MDC.','48 = 2⁴ · 3 e 72 = 2³ · 3².','Primos comuns com o menor expoente: 2³ · 3 = 24.','Cada kit: 48 ÷ 24 = 2 cartilhas de crédito e 72 ÷ 24 = 3 de investimento.'],'24 kits, cada um com 2 cartilhas de crédito e 3 de investimento.']],
 'O algoritmo de Euclides, de cerca de 300 a.C., calcula o MDC por divisões sucessivas e ainda roda dentro de computadores. MDC(72, 48): 72 ÷ 48 deixa resto 24; 48 ÷ 24 deixa resto 0. O último divisor, 24, é o MDC.',
 'O MDC nunca passa do menor número, e o MMC nunca fica abaixo do maior. Se sua conta deu o contrário, você trocou um pelo outro.',
 ['Luzes piscam a cada 4, 6 e 10 segundos e acabaram de piscar juntas. Em quantos segundos piscam juntas de novo?',['20','60','240'],1,'MMC(4, 6, 10) = 2² · 3 · 5 = 60. O 240 é só o produto 4 × 6 × 10.'],
 ['Reencontro, ciclo, coincidência → MMC','Dividir em partes iguais máximas → MDC','MMC × MDC = a × b (para dois números)']),
A('Frações e decimais sem medo','frac',
 'Uma pizza foi cortada em 8 fatias. Você comeu 3, seu amigo comeu 2. Juntos comeram 3/8 + 2/8 = 5/8, e sobraram 3/8. Fração é só isso: fatias iguais de um inteiro.',
 [['Como ler uma fração','Em 3/8, o <b>denominador</b> (8) diz em quantas partes iguais o inteiro foi dividido. O <b>numerador</b> (3) diz quantas dessas partes estamos tomando.'],
  ['Equivalência e simplificação','Multiplicar ou dividir numerador e denominador pelo mesmo número não muda o valor: 6/8 = 3/4 = 0,75. Simplifique sempre: as alternativas costumam vir na forma mais simples.'],
  ['As quatro operações','<b>Soma e subtração</b>: iguale os denominadores pelo MMC.<br><b>Multiplicação</b>: numerador com numerador, denominador com denominador: 2/3 × 3/5 = 6/15 = 2/5.<br><b>Divisão</b>: mantenha a primeira e multiplique pelo inverso da segunda: 3/4 ÷ 1/2 = 3/4 × 2/1 = 3/2.<br>"Fração <b>de</b> um valor" é multiplicação: 2/3 de 90 = 90 ÷ 3 × 2 = 60.'],
  ['Dízima periódica em fração','Se o período começa logo após a vírgula, escreva o período sobre tantos 9 quantos forem seus algarismos: 0,777… = 7/9; 0,1212… = 12/99 = 4/33.']],
 [['Marta gastou 1/3 do salário com aluguel e 1/4 com alimentação. Que fração do salário sobrou?',
   ['Some o que foi gasto. MMC(3, 4) = 12.','1/3 = 4/12 e 1/4 = 3/12, total de 7/12.','O salário inteiro é 12/12. Sobra 12/12 − 7/12.'],'5/12 do salário.'],
  ['Um investidor resgatou 2/5 da aplicação. Depois, resgatou 1/3 do que restou. Que fração do total original ainda está aplicada?',
   ['Após o 1º resgate, restam 3/5.','O 2º resgate é 1/3 de 3/5 = 1/5 do total.','Restam 3/5 − 1/5 = 2/5.','Atalho: se tirou 1/3, ficaram 2/3 do que restava: 3/5 × 2/3 = 2/5.'],'2/5 do total.']],
 'Os antigos egípcios escreviam quase todas as frações como soma de frações com numerador 1, como 3/4 = 1/2 + 1/4. Partes do símbolo do Olho de Hórus representavam as frações 1/2, 1/4, 1/8, 1/16, 1/32 e 1/64, usadas em medidas de grãos.',
 '"1/3 do que restou" não é 1/3 do total. Antes de calcular, pergunte sempre: fração de quê?',
 ['Quanto é 3/4 ÷ 3/8?',['9/32','1/2','2'],2,'3/4 × 8/3 = 24/12 = 2.'],
 ['Soma e subtração: MMC dos denominadores','Divisão: multiplique pelo inverso','"Fração de" algo é multiplicação'])
],
prop:[
A('Razão e proporção','razao',
 'Numa agência, para cada 3 atendimentos presenciais há 5 pelo aplicativo. Essa comparação, 3 para 5, é uma razão. Quando duas razões têm o mesmo valor, temos uma proporção.',
 [['Razão','Razão entre a e b é a divisão a/b. A ordem importa: "razão entre homens e mulheres" coloca os homens em cima. Com 12 homens e 18 mulheres, a razão é 12/18 = 2/3.'],
  ['Proporção e a propriedade fundamental','Proporção é a igualdade de duas razões: a/b = c/d. Nela, <b>o produto dos meios é igual ao produto dos extremos</b>: <span class="f">a · d = b · c</span>. É a famosa "multiplicação em cruz".'],
  ['Razões com nome próprio','<b>Escala</b> = medida no desenho ÷ medida real.<br><b>Velocidade média</b> = distância ÷ tempo.<br><b>Densidade demográfica</b> = habitantes ÷ área.<br><b>Consumo</b> = quilômetros ÷ litros.'],
  ['O truque da constante k','Se a/b = 2/3, escreva a = 2k e b = 3k. Essa constante resolve quase todo problema do tipo "a soma é tanto" ou "a diferença é tanto".']],
 [['A razão entre clientes pessoa física e pessoa jurídica de uma agência é 7/2. Há 1.260 clientes ao todo. Quantos são pessoa jurídica?',
   ['Escreva PF = 7k e PJ = 2k.','Total: 7k + 2k = 9k = 1.260.','k = 1.260 ÷ 9 = 140.','PJ = 2 × 140.'],'280 clientes PJ (e 980 PF).'],
  ['Num mapa de escala 1:50.000, duas agências aparecem a 6 cm uma da outra. Qual a distância real?',
   ['Escala 1:50.000: cada 1 cm no mapa vale 50.000 cm reais.','6 cm × 50.000 = 300.000 cm.','300.000 cm = 3.000 m.'],'3 km.']],
 'O cartão do banco segue a norma ISO/IEC 7810 ID-1, com 85,60 mm × 53,98 mm. A razão entre os lados é de cerca de 1,59, próxima da "razão áurea" (≈ 1,618), proporção considerada agradável aos olhos desde a Grécia antiga.',
 'Razão "entre a e b" é a/b; "de b para a" inverte a ordem. Leia com atenção antes de montar a fração.',
 ['Se x/12 = 5/4, quanto vale x?',['9,6','15','48'],1,'Em cruz: 4x = 12 × 5 = 60, então x = 15.'],
 ['Razão = a ÷ b, na ordem dada','Proporção: produto dos meios = produto dos extremos','Use a = mk e b = nk para repartir totais']),
A('Divisão em partes proporcionais','divprop',
 'Três sócios abriram uma lotérica: um entrou com R$ 20 mil, outro com R$ 30 mil e o terceiro com R$ 50 mil. O lucro de R$ 18 mil deve ser dividido de forma justa: quem pôs mais, leva mais.',
 [['Diretamente proporcional','Para dividir N em partes diretamente proporcionais a a, b e c: some os números (a + b + c), calcule <span class="f">k = N ÷ (a + b + c)</span> e multiplique k por cada número.'],
  ['Inversamente proporcional','Quanto maior o número, menor a parte. Use os <b>inversos</b> (1/a, 1/b, 1/c), multiplique todos pelo MMC dos denominadores para virar números inteiros e então divida de forma direta. Inversos de 2, 3 e 6, vezes 6, viram 3, 2 e 1.'],
  ['Sociedades: capital × tempo','Se os sócios ficaram por tempos diferentes, o lucro é proporcional ao produto <b>capital × tempo</b> de cada um.']],
 [['Divida o lucro de R$ 18.000 entre os sócios que investiram R$ 20 mil, R$ 30 mil e R$ 50 mil.',
   ['Simplifique: 20 : 30 : 50 = 2 : 3 : 5.','Soma das partes: 2 + 3 + 5 = 10.','k = 18.000 ÷ 10 = 1.800.','Partes: 2 × 1.800, 3 × 1.800 e 5 × 1.800.'],'R$ 3.600, R$ 5.400 e R$ 9.000.'],
  ['Um prêmio de R$ 1.800 será dividido entre 3 atendentes em partes inversamente proporcionais às faltas no ano: 2, 3 e 6 faltas. Quanto recebe quem faltou menos?',
   ['Inversos: 1/2, 1/3 e 1/6.','MMC(2, 3, 6) = 6. Multiplicando por 6: 3, 2 e 1.','Soma: 3 + 2 + 1 = 6. k = 1.800 ÷ 6 = 300.','Quem faltou 2 vezes fica com 3 partes: 3 × 300.'],'R$ 900 (os outros recebem R$ 600 e R$ 300).'],
  ['Ana entrou numa sociedade com R$ 10 mil por 12 meses; Beto, com R$ 15 mil por 6 meses. Como dividir um lucro de R$ 7.000?',
   ['Capital × tempo: Ana 10 × 12 = 120; Beto 15 × 6 = 90.','Simplifique 120 : 90 = 4 : 3. Soma: 7.','k = 7.000 ÷ 7 = 1.000.'],'Ana recebe R$ 4.000 e Beto, R$ 3.000.']],
 'O Fundo de Participação dos Municípios, que repassa recursos federais às prefeituras, usa coeficientes ligados a faixas de população calculadas pelo IBGE. É divisão proporcional aplicada em escala nacional.',
 'Em divisão inversa, não divida pelos números originais. Primeiro inverta, depois tire o MMC, só então reparta.',
 ['R$ 600 divididos em partes diretamente proporcionais a 1 e 2. A maior parte é:',['R$ 200','R$ 300','R$ 400'],2,'São 3 partes, então k = 200. A maior: 2 × 200 = 400.'],
 ['Direta: k = N ÷ soma das partes','Inversa: inverta, tire o MMC, depois reparta','Sociedade: proporcional a capital × tempo']),
A('Regra de três simples e composta','r3',
 'Se 2 caixas atendem 30 clientes por hora, 4 caixas atendem 60. Até aí, intuitivo. Mas se a pergunta for sobre o tempo de fila, mais caixas significam menos minutos. Saber o sentido é metade da questão.',
 [['Passo a passo','1) Monte uma tabela com cada grandeza numa coluna.<br>2) Marque a coluna da incógnita.<br>3) Compare cada grandeza com a da incógnita: se aumentam juntas, é <b>direta</b>; se uma aumenta e a outra diminui, é <b>inversa</b>.<br>4) Inverta as razões inversas e resolva.'],
  ['Teste do dobro','Pergunte: "se eu dobrar esta grandeza, a outra dobra ou cai pela metade?" Mais produtos → mais custo (direta). Mais funcionários → menos dias (inversa). Mais velocidade → menos tempo (inversa).'],
  ['Regra de três composta','Com três ou mais grandezas, compare <b>cada uma com a da incógnita, isoladamente</b>, fingindo que as outras estão paradas. Depois multiplique tudo.'],
  ['Atalho da produtividade','Calcule quanto "uma unidade" produz (por pessoa, por hora, por dia) e depois aplique ao novo cenário. Evita confusão com o sentido das setas.']],
 [['Um carro faz um trajeto em 3 horas a 80 km/h. Em quanto tempo faria a 120 km/h?',
   ['Grandezas: velocidade e tempo.','Mais velocidade, menos tempo: inversa.','Na inversa, multiplique em linha: 80 × 3 = 120 × t.','240 = 120t, então t = 2.'],'2 horas.'],
  ['5 atendentes, trabalhando 8 horas por dia, cadastram 600 clientes em 3 dias. Quantos dias 4 atendentes, trabalhando 6 horas por dia, levam para cadastrar 900 clientes?',
   ['Incógnita: dias. Compare cada grandeza só com "dias".','Atendentes: menos atendentes, mais dias → inversa (5/4).','Horas por dia: menos horas, mais dias → inversa (8/6).','Clientes: mais clientes, mais dias → direta (900/600).','dias = 3 × 5/4 × 8/6 × 900/600 = 3 × 1,25 × 4/3 × 1,5 = 7,5.','Conferindo pelo atalho: 600 ÷ (5 × 8 × 3) = 5 clientes por atendente-hora; 900 ÷ (4 × 6 × 5) = 7,5.'],'7,5 dias.']],
 'Por volta de 240 a.C., Eratóstenes estimou o tamanho da Terra com uma regra de três. O ângulo da sombra em Alexandria mostrava que a distância até Siena era 1/50 da volta completa. Como essa distância era de cerca de 5.000 estádios, a circunferência teria 250.000 estádios, um valor bem próximo do real.',
 'Não decida o sentido pela posição na tabela nem pelo "parece". Faça sempre o teste do dobro.',
 ['12 pedreiros fazem um muro em 10 dias. Em quantos dias 8 pedreiros fariam o mesmo muro?',['6,7','12','15'],2,'Inversa: 12 × 10 = 8 × d, logo d = 15.'],
 ['Direta: crescem juntas','Inversa: uma cresce, a outra cai → multiplique em linha','Composta: compare cada grandeza só com a incógnita']),
A('Porcentagem: o idioma do banco','pct',
 'Taxa Selic, rendimento da poupança, inadimplência, desconto na tarifa: quase tudo no banco é falado em porcentagem. Dominar o cálculo mental aqui ganha minutos preciosos na prova.',
 [['Três formas da mesma coisa','25% = 25/100 = 0,25. Para calcular x% de um valor, multiplique pelo decimal: 25% de 640 = 0,25 × 640 = 160.'],
  ['Cálculo mental','<b>10%</b>: ande uma casa decimal (10% de 380 = 38).<br><b>1%</b>: ande duas casas (3,80).<br><b>5%</b>: metade dos 10% (19).<br><b>50%, 25%, 20%</b>: metade, quarta parte, quinta parte.<br>Combine: 15% de 380 = 38 + 19 = 57.'],
  ['Truque da troca','<span class="f">x% de y = y% de x</span>. Então 8% de 25 = 25% de 8 = 2. Escolha o lado mais fácil.'],
  ['Ponto percentual não é porcentagem','Se a Selic sobe de 10% para 12%, ela subiu <b>2 pontos percentuais</b>, mas <b>20%</b> em termos relativos (2 ÷ 10). As bancas cobram essa diferença.']],
 [['Numa carteira de 2.400 clientes, 3,5% estão inadimplentes. Quantos clientes?',
   ['1% de 2.400 = 24.','3% = 3 × 24 = 72.','0,5% é metade de 1% = 12.','3,5% = 72 + 12.'],'84 clientes.'],
  ['De 1.250 propostas analisadas, 900 foram aprovadas. Qual a taxa de aprovação?',
   ['Parte ÷ todo: 900 ÷ 1.250.','Simplifique: 900/1.250 = 18/25.','Multiplique em cima e embaixo por 4: 72/100.'],'72%.']],
 'O símbolo % nasceu de abreviações italianas de "per cento". Em manuscritos do século XV aparece como "p cento", depois "pc°", e com o tempo a abreviação virou o sinal que usamos hoje.',
 '"Que porcentagem A representa de B" divide A por B: o valor de referência é sempre o que vem depois do "de".',
 ['Quanto é 4% de 75?',['3','30','0,3'],0,'Pela troca, 75% de 4 = 3. Ou 0,04 × 75 = 3.'],
 ['x% = x/100','10% anda uma casa; 1% anda duas','Ponto percentual é diferença entre taxas; % é variação relativa']),
A('Acréscimos, descontos e variação percentual','fator',
 'Uma ação caiu 50% num dia e subiu 50% no seguinte. Voltou ao preço inicial? Não: perdeu 25%. Entender o fator multiplicativo evita esse e outros tropeços.',
 [['Fator de aumento e de desconto','Aumento de i%: multiplique por <span class="f">(1 + i)</span>. Desconto de i%: multiplique por <span class="f">(1 − i)</span>.<br>+15% → × 1,15 · −8% → × 0,92 · +100% → × 2.'],
  ['Sucessivos se multiplicam','Dois aumentos de 10%: 1,1 × 1,1 = 1,21 → +21%, e não +20%. Aumento de 30% seguido de desconto de 20%: 1,3 × 0,8 = 1,04 → +4%.'],
  ['Variação percentual','<span class="f">Δ% = (final − inicial) ÷ inicial</span>. O denominador é sempre o valor <b>inicial</b>.'],
  ['Voltar ao valor original','Se o valor já está com o aumento ou o desconto, divida pelo fator. Depois de 20% de desconto ficou R$ 400: original = 400 ÷ 0,8 = R$ 500.']],
 [['Uma tarifa de R$ 40 teve reajuste de 25% e depois desconto promocional de 20%. Qual o preço final?',
   ['Fator do aumento: 1,25. Fator do desconto: 0,80.','Fator total: 1,25 × 0,80 = 1,00.','40 × 1,00 = 40.'],'R$ 40, exatamente o preço inicial, porque 1,25 × 0,8 = 1.'],
  ['Um investimento caiu de R$ 8.000 para R$ 6.000. Quanto precisa subir, em porcentagem, para voltar a R$ 8.000?',
   ['A queda foi de 2.000 sobre 8.000: −25%.','Para voltar, a referência agora é o novo valor, 6.000.','Alta necessária: 2.000 ÷ 6.000 = 1/3.'],'≈ 33,3%. Recuperar uma perda exige uma alta maior que a queda.']],
 'Na Bolsa, uma ação que cai 50% precisa subir 100% para voltar ao preço de antes. Por isso gestores de risco dizem que evitar grandes perdas vale mais do que perseguir grandes ganhos.',
 'Aumento de 20% seguido de desconto de 20% não volta ao início: 1,2 × 0,8 = 0,96, uma perda de 4%.',
 ['Depois de um aumento de 25%, um produto passou a custar R$ 150. Quanto custava antes?',['R$ 112,50','R$ 120','R$ 125'],1,'150 ÷ 1,25 = 120. Tirar 25% de 150 (R$ 112,50) é o erro clássico.'],
 ['Aumento: × (1 + i). Desconto: × (1 − i)','Variações sucessivas: multiplique os fatores','Δ% sempre sobre o valor inicial'],'fator')
],
log:[
A('Proposições e conectivos','truth',
 '"A agência abre às 10h." Isso é uma proposição: pode ser verdadeira ou falsa. "Que horas a agência abre?" não é, porque perguntas não têm valor lógico.',
 [['O que é proposição','Frase declarativa que admite exatamente um valor: V ou F. <b>Não</b> são proposições: perguntas, ordens ("Feche a porta!"), exclamações e sentenças abertas com variável ("x + 2 = 5").'],
  ['Os conectivos','<b>Negação</b> (~p): inverte o valor.<br><b>Conjunção</b> (p ∧ q, "e"): V só se as duas forem V.<br><b>Disjunção</b> (p ∨ q, "ou"): F só se as duas forem F.<br><b>Disjunção exclusiva</b> ("ou… ou…"): V se exatamente uma for V.<br><b>Condicional</b> (p → q, "se… então"): F só no caso V → F.<br><b>Bicondicional</b> (p ↔ q, "se e somente se"): V quando as duas têm o mesmo valor.'],
  ['Tamanho da tabela-verdade','Com n proposições simples, a tabela tem <span class="f">2ⁿ</span> linhas. Com 3 proposições, 8 linhas.'],
  ['A condicional, sem mistério','Pense numa promessa: "Se bater a meta, ganha bônus." Só há promessa quebrada se a pessoa bater a meta e não ganhar o bônus. Se não bateu a meta, a promessa não foi descumprida, ganhe bônus ou não.']],
 [['Sabendo que p é V e q é F, qual o valor de (p ∨ q) → (p ∧ q)?',
   ['p ∨ q: basta uma verdadeira → V.','p ∧ q: precisa das duas verdadeiras → F.','V → F é o único caso falso da condicional.'],'Falso.'],
  ['Quantas linhas tem a tabela-verdade de (p ∧ q) ∨ (r → s)?',
   ['Conte as proposições simples diferentes: p, q, r, s.','São 4.','Linhas = 2⁴.'],'16 linhas.']],
 'George Boole publicou em 1854 uma álgebra em que tudo vale 0 ou 1. Quase um século depois, Claude Shannon mostrou que circuitos elétricos podiam executar essa lógica. Todo app de banco funciona, lá no fundo, com "e", "ou" e "não".',
 'Na condicional, se a primeira parte é falsa, a frase toda é verdadeira. "Se 2 + 2 = 5, então a Lua é de queijo" é logicamente verdadeira.',
 ['Qual destas frases é uma proposição?',['Pague a fatura até sexta.','O Banestes tem sede no Espírito Santo.','Será que vai chover?'],1,'É uma declaração que pode ser julgada V ou F. Ordens e perguntas não são proposições.'],
 ['"e": tudo V · "ou": basta um V','Condicional só é F em V → F','Tabela-verdade: 2ⁿ linhas']),
A('Negações e equivalências','neg',
 'O cliente reclama: "Não é verdade que todos os boletos foram pagos." Ele quer dizer que nenhum foi pago? Não! Basta um em aberto. Negar corretamente é o tema de lógica mais cobrado pela FCC.',
 [['Leis de De Morgan','<span class="f">~(p ∧ q) = ~p ∨ ~q</span> → troca "e" por "ou" e nega as partes.<br><span class="f">~(p ∨ q) = ~p ∧ ~q</span> → troca "ou" por "e" e nega as partes.'],
  ['Negação da condicional','<span class="f">~(p → q) = p ∧ ~q</span>. Mantém a primeira, troca por "e", nega a segunda. Para lembrar: <b>MA-NÉ</b> (MAntém a primeira E NEga a segunda).'],
  ['Equivalências da condicional','<b>Contrapositiva</b>: <span class="f">p → q ≡ ~q → ~p</span> (inverte a ordem e nega as duas).<br><b>Troca pelo "ou"</b>: <span class="f">p → q ≡ ~p ∨ q</span> (NEga a primeira, MAntém a segunda: NEY-MAR).'],
  ['Quantificadores','~(Todo A é B) = Algum A não é B.<br>~(Algum A é B) = Nenhum A é B.<br>~(Nenhum A é B) = Algum A é B.']],
 [['Negue: "O cliente tem conta corrente e cartão de crédito."',
   ['É uma conjunção (p ∧ q).','De Morgan: troque "e" por "ou" e negue cada parte.'],'"O cliente não tem conta corrente ou não tem cartão de crédito."'],
  ['Qual frase é equivalente a "Se o Pix falhou, então o cliente ligou"?',
   ['Contrapositiva: inverta e negue. "Se o cliente não ligou, então o Pix não falhou."','Troca pelo "ou": negue a primeira e mantenha a segunda. "O Pix não falhou ou o cliente ligou."','As duas estão certas; procure qualquer uma delas nas alternativas.'],'"Se o cliente não ligou, então o Pix não falhou" (ou a versão com "ou").']],
 'Augustus De Morgan, que dá nome às leis, propôs um enigma sobre a própria idade: "Eu tinha x anos no ano x²". Ele nasceu em 1806 e tinha 43 anos em 1849, e 43² = 1849.',
 'A negação de "se p, então q" nunca é outra condicional. Numa questão de negação de condicional, descarte toda alternativa com "se… então".',
 ['A negação de "Algum gerente é economista" é:',['Algum gerente não é economista.','Nenhum gerente é economista.','Todo gerente é economista.'],1,'Negar "algum é" é afirmar que nenhum é.'],
 ['De Morgan: troca e/ou e nega as partes','~(p → q) = p ∧ ~q','p → q ≡ ~q → ~p ≡ ~p ∨ q']),
A('Argumentos válidos e silogismos','venn',
 '"Todo bancário estuda matemática. Lia estuda matemática. Logo, Lia é bancária." Soa convincente, mas é um argumento inválido. Nesta aula você aprende a farejar essas armadilhas.',
 [['Validade não é verdade','Um argumento é <b>válido</b> quando, se as premissas forem verdadeiras, a conclusão é obrigatoriamente verdadeira. Não importa se as frases são verdadeiras no mundo real; importa a forma.'],
  ['Formas válidas','<b>Modus ponens</b>: p → q; p; logo q.<br><b>Modus tollens</b>: p → q; ~q; logo ~p.<br><b>Silogismo disjuntivo</b>: p ∨ q; ~p; logo q.<br><b>Silogismo hipotético</b>: p → q; q → r; logo p → r.'],
  ['Falácias clássicas','<b>Afirmar o consequente</b>: p → q; q; logo p (inválido).<br><b>Negar o antecedente</b>: p → q; ~p; logo ~q (inválido).'],
  ['Desenhe os conjuntos','Para "todo", "algum" e "nenhum", use círculos. "Todo A é B": A dentro de B. "Nenhum A é B": círculos separados. "Algum A é B": círculos que se cruzam. A conclusão só é válida se aparecer em <b>todos</b> os desenhos possíveis.']],
 [['Premissas: "Se a taxa sobe, o crédito encarece." e "O crédito não encareceu." O que se conclui?',
   ['Forma: p → q e ~q.','É modus tollens: conclui-se ~p.'],'"A taxa não subiu."'],
  ['"Todo bancário estuda matemática. Lia estuda matemática. Logo, Lia é bancária." É válido?',
   ['Desenhe o círculo dos bancários dentro do círculo de quem estuda matemática.','Lia está no círculo maior, mas pode estar fora do círculo dos bancários.','Existe um desenho em que a conclusão falha, então o argumento é inválido.'],'Inválido: é a falácia de afirmar o consequente.']],
 'Aristóteles catalogou os silogismos há mais de 2.300 anos, e a classificação dele foi a base do ensino de lógica na Europa por quase dois milênios.',
 'Uma conclusão verdadeira no mundo real não torna o argumento válido. A pergunta é sempre: ela decorre <b>necessariamente</b> das premissas?',
 ['"Ou Ana viaja ou Ana trabalha. Ana não viajou." Conclui-se que:',['Ana trabalha.','Ana não trabalha.','Nada se conclui.'],0,'Silogismo disjuntivo: eliminada uma opção, sobra a outra.'],
 ['Válido = conclusão forçada pelas premissas','Modus ponens e modus tollens são válidos','Afirmar o consequente é falácia']),
A('Relações arbitrárias: quem é quem','grade',
 'Três clientes, três produtos e uma pilha de pistas soltas. Problemas de associação parecem bagunçados, mas uma tabela organiza tudo e a resposta aparece sozinha.',
 [['Monte a grade','Coloque as pessoas nas linhas e as características nas colunas. Marque ✔ quando a pista confirma e ✘ quando elimina. Em cada linha e em cada coluna haverá exatamente um ✔.'],
  ['Comece pelas pistas diretas','Pistas afirmativas ("Rui mora em Vitória") preenchem um ✔ e eliminam o resto da linha e da coluna. Pistas negativas ("Ana não mora na Serra") colocam um ✘.'],
  ['Ordenações','Para filas, alturas e posições, desenhe casas numeradas. Frases como "B está imediatamente atrás de A" prendem duas casas juntas; teste as posições possíveis.'],
  ['Avalie as condições','O edital pede para "avaliar as condições usadas para estabelecer a estrutura das relações". Às vezes a questão pergunta qual pista é desnecessária ou qual falta. Retire uma pista e veja se a solução continua única.']],
 [['Ana, Beto e Caio contrataram um produto cada: seguro, consórcio e previdência. Ana não contratou seguro. Beto contratou previdência. Quem contratou o quê?',
   ['Beto → previdência (pista direta). Risque previdência para Ana e Caio.','Ana não contratou seguro nem previdência: sobra consórcio.','Caio fica com o que restou: seguro.'],'Ana: consórcio · Beto: previdência · Caio: seguro.'],
  ['Cinco clientes estão numa fila. Dani está no meio. Eva está imediatamente atrás de Dani. Fábio é o primeiro. Gil não é o último. Em que posição está Hugo?',
   ['Posições de 1 a 5. Fábio = 1. Dani = 3 (meio).','Eva, imediatamente atrás de Dani = 4.','Sobram as posições 2 e 5 para Gil e Hugo.','Gil não é o último, então Gil = 2.'],'Hugo é o 5º, o último da fila.']],
 'Esses quebra-cabeças ficaram famosos como "Enigma de Einstein": cinco casas, cinco nacionalidades, cinco bebidas e quinze pistas. A autoria de Einstein é lenda, mas o método da grade resolve o enigma.',
 'Não tire conclusões de uma pista sozinha. "Ana não contratou seguro" não diz o que ela contratou; só o cruzamento com as outras pistas diz.',
 ['Numa fila com Lu, Ivo e Zé, Lu não é a primeira e Ivo está logo atrás de Lu. Quem é o primeiro?',['Lu','Ivo','Zé'],2,'Lu não pode ser a 1ª nem a 3ª (Ivo vem atrás dela). Então Lu é a 2ª, Ivo o 3º e Zé o 1º.'],
 ['Grade pessoa × característica','Cada ✔ elimina o resto da linha e da coluna','Ordenações: desenhe as casas']),
A('Sequências, tempo e espaço','ciclo',
 '2, 4, 8, 16… e se o próximo for 31? Sequências escondem uma regra, e calendários e relógios são sequências que se repetem em ciclos.',
 [['Caçando o padrão','Teste nesta ordem: 1) diferenças entre termos (constantes? crescentes?); 2) razões (multiplica por quanto?); 3) duas sequências intercaladas (posições ímpares e pares); 4) operações mistas (× 2 + 1); 5) letras viram números pela posição no alfabeto (A = 1, B = 2…).'],
  ['Calendário e relógio','A semana repete a cada 7 dias: avance só o <b>resto</b> da divisão por 7. Ano comum tem 365 dias (52 semanas + 1 dia); bissexto, 366 (+2). No relógio, o ponteiro dos minutos anda 6° por minuto e o das horas, 0,5° por minuto.'],
  ['Orientação espacial','Rotações: giro à direita soma 90°, à esquerda subtrai. Quatro giros de 90° no mesmo sentido voltam à posição inicial. Num dado comum, faces opostas somam 7.'],
  ['Formação de conceitos e discriminação de elementos','Questões de "qual elemento não pertence ao grupo" pedem a característica comum. Liste propriedades (par, primo, quadrado perfeito, número de letras, vogais) até achar a que separa um único elemento.']],
 [['Qual o próximo termo: 2, 5, 10, 17, 26, …?',
   ['Diferenças: 3, 5, 7, 9 (ímpares consecutivos).','Próxima diferença: 11.','26 + 11 = 37.','Outra leitura: n² + 1 → 1+1, 4+1, 9+1, 16+1, 25+1, 36+1.'],'37'],
  ['Um vigilante trabalha um dia e folga dois. Trabalhou numa segunda-feira. Depois de quantos dias volta a trabalhar numa segunda?',
   ['O ciclo dele tem 3 dias; o da semana, 7.','Ciclos que coincidem: MMC(3, 7) = 21.','21 dias depois, é segunda de novo e é dia de trabalho.'],'21 dias, ou seja, três semanas depois.'],
  ['Uma pessoa olha para o norte, gira 90° à direita, depois 180° à esquerda e mais 270° à direita. Para onde olha?',
   ['Use graus: direita +, esquerda −.','+90 − 180 + 270 = +180.','180° a partir do norte.'],'Para o sul.']],
 'Na sequência de Fibonacci (1, 1, 2, 3, 5, 8, 13…), cada termo é a soma dos dois anteriores. Ela foi apresentada à Europa em 1202 no Liber Abaci, um livro de aritmética comercial que também ensinava a calcular juros e a converter moedas.',
 'Não pare no primeiro padrão que "quase" funciona. Confira a regra em todos os termos dados antes de calcular o próximo.',
 ['Qual número não pertence ao grupo: 9, 16, 25, 30, 36?',['16','30','36'],1,'Os outros são quadrados perfeitos (3², 4², 5², 6²). O 30 não é.'],
 ['Teste diferenças, depois razões, depois intercaladas','Dias da semana: avance o resto da divisão por 7','Direita +90°, esquerda −90°'])
],
cont:[
A('Princípio multiplicativo e aditivo','tree',
 'A senha do cartão tem 4 dígitos. Quantas senhas existem? 10 × 10 × 10 × 10 = 10.000. Contar sem precisar listar é o superpoder desta aula.',
 [['Princípio multiplicativo ("e")','Se uma decisão tem m opções <b>e</b>, para cada uma delas, a decisão seguinte tem n opções, o total é <span class="f">m × n</span>. Use quando as escolhas acontecem em etapas.'],
  ['Princípio aditivo ("ou")','Se você escolhe entre grupos que não se misturam, <b>some</b>. 3 tipos de conta corrente <b>ou</b> 2 de poupança: 3 + 2 = 5 opções de conta.'],
  ['Comece pela restrição','Desenhe um tracinho para cada posição e preencha primeiro as que têm restrição: não pode começar com 0, tem de ser par, letras distintas…']],
 [['Quantos números de 3 algarismos distintos existem? (o primeiro não pode ser 0)',
   ['Três posições: _ _ _.','1ª posição: 9 opções (de 1 a 9).','2ª posição: 9 opções (pode ser 0, mas não o já usado).','3ª posição: 8 opções.','9 × 9 × 8.'],'648 números.'],
  ['Quantos números pares de 3 algarismos distintos podem ser formados com 1, 2, 3, 4 e 5?',
   ['Restrição: o último algarismo deve ser par (2 ou 4): 2 opções.','Comece por ele. Sobram 4 algarismos.','1ª posição: 4 opções. 2ª posição: 3 opções.','4 × 3 × 2.'],'24 números.']],
 'A placa Mercosul usa o formato LLL NLNN (3 letras, 1 número, 1 letra, 2 números). São 26⁴ × 10³ ≈ 457 milhões de combinações, mais que o dobro das 175 milhões do antigo formato LLL-NNNN.',
 '"E" multiplica, "ou" soma. Trocar um pelo outro dá uma resposta de tamanho completamente errado.',
 ['Um cardápio tem 3 entradas, 4 pratos e 2 sobremesas. Quantas refeições com uma opção de cada são possíveis?',['9','24','12'],1,'3 × 4 × 2 = 24.'],
 ['Etapas ("e") → multiplica','Grupos separados ("ou") → soma','Preencha primeiro as posições com restrição']),
A('Fatorial e permutações','perm',
 'De quantas formas 5 clientes podem formar uma fila? 5 × 4 × 3 × 2 × 1 = 120. Esse produto tem nome: 5 fatorial, escrito 5!.',
 [['Fatorial','<span class="f">n! = n × (n − 1) × … × 2 × 1</span>. Por definição, 0! = 1. Valores úteis: 3! = 6, 4! = 24, 5! = 120, 6! = 720, 7! = 5.040.'],
  ['Permutação simples','Organizar n elementos distintos em fila: <span class="f">Pₙ = n!</span>. Anagramas de palavras sem letras repetidas são permutações: BANCO tem 5! = 120 anagramas.'],
  ['Permutação com repetição','Se há elementos repetidos, divida pelo fatorial de cada repetição: <span class="f">n! ÷ (a! · b! · …)</span>. CAIXA tem o A duas vezes: 5! ÷ 2! = 60 anagramas.'],
  ['Simplifique antes de multiplicar','8! ÷ 6! = 8 × 7 × 6! ÷ 6! = 56. Nunca calcule fatoriais grandes por inteiro.']],
 [['Quantos anagramas da palavra PRAZO começam com vogal?',
   ['Vogais em PRAZO: A e O → 2 opções para a 1ª letra.','As 4 letras restantes se permutam: 4! = 24.','2 × 24.'],'48 anagramas.'],
  ['Quantos anagramas tem a palavra CHEQUE?',
   ['6 letras, com o E repetido 2 vezes.','6! = 720.','720 ÷ 2! = 360.'],'360 anagramas.']],
 'Um baralho de 52 cartas pode ser embaralhado de 52! formas, um número com 68 algarismos. É tão grande que, muito provavelmente, cada embaralhamento bem feito da história produziu uma ordem nunca vista antes.',
 'Em anagramas com letras repetidas, esquecer de dividir pelo fatorial das repetições é o erro mais comum.',
 ['Quanto vale 10! ÷ 8!?',['2','90','720'],1,'10 × 9 × 8! ÷ 8! = 90.'],
 ['n! = n · (n − 1) · … · 1, com 0! = 1','Permutação simples: n!','Com repetição: divida pelos fatoriais das repetições']),
A('Arranjos e combinações','arr',
 'Escolher presidente, vice e secretário entre 10 pessoas é diferente de escolher uma comissão de 3 entre as mesmas 10. No primeiro caso a ordem importa; no segundo, não.',
 [['O teste da troca','Pegue um resultado e troque dois elementos de lugar. Mudou alguma coisa? <b>Arranjo</b> (ordem importa). Continuou igual? <b>Combinação</b>.'],
  ['Arranjo','<span class="f">A(n,p) = n! ÷ (n − p)!</span>, que na prática é n × (n − 1) × … com p fatores. A(10,3) = 10 × 9 × 8 = 720.'],
  ['Combinação','<span class="f">C(n,p) = n! ÷ [p! (n − p)!]</span>. É o arranjo dividido por p!, porque as p! ordens dos mesmos elementos contam uma vez só. C(10,3) = 720 ÷ 6 = 120.'],
  ['Atalho de simetria','<span class="f">C(n,p) = C(n, n − p)</span>. Escolher 8 de 10 é o mesmo que escolher os 2 que ficam de fora: C(10,8) = C(10,2) = 45.']],
 [['A agência vai escolher, entre 7 funcionários, 2 para um treinamento (sem distinção de função). Quantas duplas são possíveis?',
   ['Trocar os dois de lugar não muda a dupla → combinação.','C(7,2) = (7 × 6) ÷ (2 × 1).'],'21 duplas.'],
  ['Num grupo de 6 homens e 4 mulheres, quantas comissões de 3 pessoas têm exatamente 2 mulheres?',
   ['Escolha as mulheres: C(4,2) = 6.','Escolha o homem: C(6,1) = 6.','Mulheres "e" homem → multiplique: 6 × 6.'],'36 comissões.']],
 'Na Mega-Sena, apostar 6 números entre 60 dá C(60,6) = 50.063.860 combinações. Com uma aposta simples, a chance de acertar a sena é de 1 em mais de 50 milhões.',
 '"Comissão", "grupo", "equipe" e "amostra" sugerem combinação; "senha", "fila", "cargos diferentes" e "pódio" sugerem arranjo. Mas confirme sempre com o teste da troca.',
 ['Com 5 sabores, quantas taças de 2 sabores diferentes podem ser montadas?',['10','20','25'],0,'A ordem dos sabores na taça não importa: C(5,2) = 10.'],
 ['Ordem importa → arranjo','Ordem não importa → combinação = arranjo ÷ p!','C(n,p) = C(n, n − p)']),
A('Probabilidade: medindo as chances','prob',
 'Na agência, 1 em cada 4 clientes pede um cartão novo. Qual a chance de o próximo cliente pedir? 25%. Probabilidade é contar casos e comparar.',
 [['Vocabulário','<b>Experimento aleatório</b>: tem resultado incerto (lançar um dado).<br><b>Espaço amostral (Ω)</b>: todos os resultados possíveis, {1, 2, 3, 4, 5, 6}.<br><b>Evento</b>: um subconjunto do espaço amostral, como "sair par" = {2, 4, 6}.'],
  ['Fórmula clássica','<span class="f">P(A) = casos favoráveis ÷ casos possíveis</span>, quando todos os resultados são igualmente prováveis. Sempre 0 ≤ P ≤ 1: evento impossível vale 0, evento certo vale 1.'],
  ['Complementar','<span class="f">P(não A) = 1 − P(A)</span>. Em problemas com "pelo menos um", calcule a chance de "nenhum" e subtraia de 1.'],
  ['União de eventos','<span class="f">P(A ou B) = P(A) + P(B) − P(A e B)</span>. A interseção é subtraída para não ser contada duas vezes. Se A e B não podem acontecer juntos (mutuamente exclusivos), basta somar.']],
 [['Uma carta é sorteada de um baralho comum de 52. Qual a probabilidade de ser de copas ou um rei?',
   ['Copas: 13 cartas. Reis: 4 cartas.','O rei de copas está nos dois grupos: interseção = 1.','Favoráveis: 13 + 4 − 1 = 16.','P = 16 ÷ 52.'],'4/13 (≈ 30,8%).'],
  ['Dois dados são lançados. Qual a probabilidade de a soma ser 7?',
   ['Espaço amostral: 6 × 6 = 36 pares.','Pares com soma 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) → 6 pares.','P = 6 ÷ 36.'],'1/6. A soma 7 é a mais provável de todas.']],
 'A teoria da probabilidade nasceu em 1654, em cartas trocadas entre Pascal e Fermat. Eles queriam resolver como dividir de forma justa as apostas de um jogo interrompido antes do fim.',
 'Ao lançar dois dados, (2,5) e (5,2) são resultados diferentes. Contar só um deles distorce o espaço amostral.',
 ['Uma urna tem 3 bolas brancas e 7 pretas. Qual a probabilidade de sortear uma branca?',['3/7','3/10','7/10'],1,'São 3 casos favoráveis em 10 possíveis.'],
 ['P = favoráveis ÷ possíveis','"Pelo menos um" → 1 − P(nenhum)','P(A ∪ B) = P(A) + P(B) − P(A ∩ B)'],'dado'),
A('Probabilidade condicional e independência','arvp',
 'Um sistema antifraude bloqueia 98% das fraudes. Se uma transação foi bloqueada, qual a chance de ser fraude mesmo? A resposta surpreende, e depende de probabilidade condicional.',
 [['Condicional: o universo encolhe','<span class="f">P(A | B) = P(A e B) ÷ P(B)</span>. Lê-se "probabilidade de A dado B". Como já se sabe que B aconteceu, os casos possíveis passam a ser só os de B.'],
  ['Regra do produto','<span class="f">P(A e B) = P(A) · P(B | A)</span>. Em retiradas sem reposição, a 2ª probabilidade muda: com 5 bolas azuis em 8, P(2 azuis) = 5/8 × 4/7.'],
  ['Independência','A e B são independentes quando um não altera a chance do outro: <span class="f">P(A e B) = P(A) · P(B)</span>. Lançamentos de moeda e de dado, e sorteios com reposição, são independentes.'],
  ['Árvore de probabilidades','Desenhe um ramo para cada possibilidade de cada etapa e escreva a probabilidade no ramo. Multiplique ao longo de um caminho; some os caminhos que levam ao mesmo resultado.']],
 [['Numa carteira, 60% dos clientes são mulheres. Entre as mulheres, 30% têm investimento; entre os homens, 20%. Sorteia-se um cliente que tem investimento. Qual a chance de ser mulher?',
   ['Caminho mulher → investe: 0,6 × 0,3 = 0,18.','Caminho homem → investe: 0,4 × 0,2 = 0,08.','P(investe) = 0,18 + 0,08 = 0,26.','P(mulher | investe) = 0,18 ÷ 0,26.'],'9/13 ≈ 69%.'],
  ['O antifraude da história: 1% das transações são fraudes. Ele bloqueia 98% das fraudes, mas também bloqueia por engano 2% das transações legítimas. Dada uma transação bloqueada, qual a chance de ser fraude?',
   ['Imagine 10.000 transações: 100 fraudes e 9.900 legítimas.','Fraudes bloqueadas: 98% de 100 = 98.','Legítimas bloqueadas: 2% de 9.900 = 198.','Total bloqueado: 98 + 198 = 296.','P(fraude | bloqueada) = 98 ÷ 296.'],'≈ 33%. Dois em cada três bloqueios são alarmes falsos.']],
 'Paradoxo do aniversário: num grupo de apenas 23 pessoas, a chance de duas fazerem aniversário no mesmo dia já passa de 50%. Com 57 pessoas, passa de 99%.',
 'P(A | B) é diferente de P(B | A). A chance de um bloqueio ser fraude não é a mesma que a chance de uma fraude ser bloqueada.',
 ['Uma moeda deu cara 5 vezes seguidas. Qual a probabilidade de dar cara no 6º lançamento?',['1/64','1/2','Menos de 1/2'],1,'Lançamentos são independentes: a moeda não tem memória. Achar o contrário é a "falácia do apostador".'],
 ['P(A | B) = P(A ∩ B) ÷ P(B)','Independentes: P(A ∩ B) = P(A) · P(B)','Árvore: multiplica no caminho, soma entre caminhos'])
],
est:[
A('População, amostra e amostragem','amostra',
 'Para saber se os clientes estão satisfeitos, o banco não precisa ouvir os milhões de correntistas. Uma amostra bem escolhida de algumas centenas já conta a história.',
 [['Conceitos básicos','<b>População</b>: todos os elementos de interesse (todos os clientes).<br><b>Amostra</b>: a parte da população efetivamente observada.<br><b>Censo</b>: pesquisa com a população inteira.<br><b>Parâmetro</b> descreve a população; <b>estatística</b> descreve a amostra.'],
  ['Tipos de variável','<b>Qualitativa</b>: nominal (cor, estado civil) ou ordinal (escolaridade, nível de satisfação).<br><b>Quantitativa</b>: discreta, que se conta (nº de filhos, nº de contas), ou contínua, que se mede (renda, altura, tempo de espera).'],
  ['Técnicas de amostragem','<b>Aleatória simples</b>: sorteio; todos têm a mesma chance.<br><b>Sistemática</b>: um a cada k elementos da lista (todo 10º cliente).<br><b>Estratificada</b>: divide a população em grupos homogêneos (estratos, como faixa de renda) e sorteia dentro de cada um, em geral na proporção de cada estrato.<br><b>Por conglomerados</b>: sorteia grupos inteiros (algumas agências) e pesquisa todos dentro deles.<br><b>Por conveniência</b>: quem estiver à mão. Não é probabilística e pode distorcer o resultado.']],
 [['Um banco tem 60% de clientes PF e 40% PJ e quer uma amostra estratificada proporcional de 500 clientes. Quantos de cada tipo?',
   ['Estratificada proporcional respeita as proporções da população.','PF: 60% de 500 = 300.','PJ: 40% de 500 = 200.'],'300 PF e 200 PJ.'],
  ['De uma lista de 2.000 contas, deseja-se uma amostra sistemática de 100. Qual o intervalo, e como começar?',
   ['Intervalo k = 2.000 ÷ 100 = 20.','Sorteie um ponto de partida entre 1 e 20, por exemplo 7.','Selecione 7, 27, 47, 67… até completar 100 contas.'],'k = 20, começando num número sorteado entre 1 e 20.']],
 'Em 1936, a revista Literary Digest consultou 2,4 milhões de pessoas e previu a derrota de Roosevelt. George Gallup, com uma amostra muito menor e bem escolhida, acertou a vitória dele. A revista usou listas de telefone e de donos de carro, que deixavam de fora os mais pobres.',
 'Amostra grande não é garantia de boa amostra. O que importa é ser representativa, e não apenas numerosa.',
 ['Pesquisar todos os clientes de 5 agências sorteadas entre 80 é amostragem:',['estratificada','por conglomerados','sistemática'],1,'Sorteiam-se grupos inteiros (agências) e pesquisa-se todo mundo dentro deles.'],
 ['Censo = população toda; amostra = uma parte','Qualitativa × quantitativa (discreta ou contínua)','Estratos: sorteia dentro de cada grupo. Conglomerados: sorteia grupos inteiros']),
A('Tabelas, frequências e gráficos','hist',
 'Uma planilha com 500 tempos de espera não diz nada à primeira vista. Organizada numa tabela de frequências e num histograma, mostra em segundos onde a fila trava.',
 [['Distribuição de frequências','<b>Frequência absoluta (fᵢ)</b>: quantas vezes o valor aparece.<br><b>Relativa (frᵢ)</b>: fᵢ ÷ total, em %.<br><b>Acumulada (Fᵢ)</b>: soma das frequências até aquela linha.<br>Dados contínuos são agrupados em <b>classes</b> (0 ⊢ 5 min, 5 ⊢ 10 min…). O símbolo ⊢ inclui o valor da esquerda e exclui o da direita.'],
  ['Ponto médio e amplitude da classe','Na classe 10 ⊢ 20, a amplitude é 10 e o ponto médio é 15. O ponto médio representa a classe no cálculo da média.'],
  ['Escolhendo o gráfico','<b>Histograma</b>: barras coladas, para classes de dados contínuos.<br><b>Barras ou colunas</b>: comparar categorias.<br><b>Setores (pizza)</b>: partes de um todo; cada fatia mede <span class="f">% × 360°</span>.<br><b>Linhas</b>: evolução ao longo do tempo.<br><b>Infográfico</b>: combina números, ícones e texto; leia legendas e unidades.'],
  ['Lendo com atenção','Confira o título, a unidade (mil? milhões? %?), o eixo que não começa no zero e a fonte. Muitas alternativas erradas exploram justamente a unidade.']],
 [['Num gráfico de setores, 35% dos clientes preferem atendimento pelo app. Qual o ângulo dessa fatia?',
   ['Fatia = porcentagem × 360°.','0,35 × 360 = 126.'],'126°.'],
  ['Tempos de espera: 0 ⊢ 5 min (12 clientes), 5 ⊢ 10 (20 clientes), 10 ⊢ 15 (8 clientes). Qual a frequência relativa da 2ª classe e a frequência acumulada até ela?',
   ['Total: 12 + 20 + 8 = 40.','Relativa da 2ª classe: 20 ÷ 40 = 50%.','Acumulada até a 2ª: 12 + 20 = 32 clientes (80%).'],'50% e 32 clientes.']],
 'Florence Nightingale, pioneira da enfermagem, criou em 1858 o "diagrama da rosa", um gráfico circular que mostrava que mais soldados morriam de doenças evitáveis do que em combate. O gráfico ajudou a mudar as regras sanitárias do exército britânico.',
 'Um eixo vertical que não começa no zero faz uma diferença pequena parecer enorme. Leia os números, não só o tamanho das barras.',
 ['Para mostrar a evolução da inflação mês a mês, o gráfico mais adequado é o de:',['setores','linhas','histograma'],1,'Linhas mostram a tendência ao longo do tempo.'],
 ['fᵢ absoluta, frᵢ relativa, Fᵢ acumulada','Setores: % × 360°','Histograma para classes contínuas; linhas para o tempo']),
A('Média, mediana e moda','media',
 'Cinco pessoas num café ganham R$ 3 mil por mês cada. Entra um milionário que ganha R$ 1 milhão. A média salarial do café salta para mais de R$ 169 mil, mas ninguém ali ficou mais rico. A mediana, que continua em R$ 3 mil, conta a verdade.',
 [['Média aritmética','<span class="f">x̄ = soma dos valores ÷ quantidade</span>. É sensível a valores extremos (outliers).'],
  ['Média ponderada','Cada valor é multiplicado pelo seu peso: <span class="f">x̄ = Σ(xᵢ · pᵢ) ÷ Σpᵢ</span>. A nota final do Banestes é assim: (Gerais × 1 + Específicos × 2) ÷ 3. Numa tabela de frequências, a frequência faz o papel do peso.'],
  ['Mediana','Ordene os dados. Quantidade ímpar: o termo do meio, na posição (n + 1)/2. Quantidade par: a média dos dois termos centrais. Valores extremos não a afetam.'],
  ['Moda','O valor que mais se repete. Pode não existir (amodal) ou haver mais de uma (bimodal). É a única das três que serve para dados qualitativos, como "a cor de cartão mais pedida".'],
  ['Propriedades da média','Somar uma constante a todos os valores soma essa constante à média. Multiplicar todos por k multiplica a média por k.']],
 [['Um candidato precisa de nota final 6,0. Tirou 4,5 em Conhecimentos Gerais (peso 1). Qual a nota mínima em Específicos (peso 2)?',
   ['Nota final = (G × 1 + E × 2) ÷ 3 ≥ 6.','Logo, G + 2E ≥ 18.','4,5 + 2E ≥ 18 → 2E ≥ 13,5.','E ≥ 6,75.'],'6,75 em Específicos.'],
  ['Saldos (em R$ mil) de 8 clientes: 2, 3, 3, 4, 5, 6, 9, 40. Calcule média, mediana e moda.',
   ['Soma: 2 + 3 + 3 + 4 + 5 + 6 + 9 + 40 = 72. Média: 72 ÷ 8 = 9.','São 8 valores (par): os centrais são o 4º e o 5º, 4 e 5. Mediana: 4,5.','Moda: 3, que aparece duas vezes.','Repare: o 40 puxou a média para 9, valor que só um cliente supera.'],'Média 9 · mediana 4,5 · moda 3.']],
 'Por causa dos extremos, economistas preferem a mediana para descrever a renda "típica" de um país. A renda média fica bem acima da mediana porque poucas pessoas ganham muito.',
 'Esquecer de ordenar os dados antes de achar a mediana é o erro número 1.',
 ['A média de 4 números é 10. Somando 3 a cada um deles, a nova média é:',['10','13','22'],1,'Somar uma constante a todos soma a mesma constante à média.'],
 ['Média: sensível a extremos','Mediana: ordene e pegue o do meio','Moda: o mais frequente (serve para dados qualitativos)']),
A('Medidas de dispersão','disp',
 'Duas agências têm tempo médio de espera de 10 minutos. Na primeira, todo mundo espera entre 9 e 11. Na segunda, uns esperam 1 minuto e outros, 19. A média é igual; a experiência do cliente, não.',
 [['Amplitude','<span class="f">A = maior − menor</span>. Rápida, mas usa só dois valores.'],
  ['Desvio médio','A média das distâncias, em módulo, de cada valor até a média: <span class="f">DM = Σ|xᵢ − x̄| ÷ n</span>.'],
  ['Variância e desvio padrão','A variância é a média dos quadrados dos desvios: <span class="f">σ² = Σ(xᵢ − x̄)² ÷ n</span> (na amostra, divide-se por n − 1). O desvio padrão é a raiz: <span class="f">σ = √σ²</span>, e volta para a mesma unidade dos dados.'],
  ['Coeficiente de variação','<span class="f">CV = σ ÷ x̄</span>, em %. Compara a dispersão de grupos com médias ou unidades diferentes. Quanto menor o CV, mais homogêneo o grupo.'],
  ['Propriedades','Somar uma constante a todos: a média muda, a dispersão <b>não</b> muda. Multiplicar todos por k: o desvio padrão fica × k e a variância, × k².']],
 [['Calcule amplitude, desvio médio, variância e desvio padrão de 2, 4, 6, 8, 10.',
   ['Média: 30 ÷ 5 = 6. Amplitude: 10 − 2 = 8.','Desvios: −4, −2, 0, 2, 4. A soma dos módulos é 12 → DM = 12 ÷ 5 = 2,4.','Quadrados dos desvios: 16, 4, 0, 4, 16 → soma 40. Variância: 40 ÷ 5 = 8.','Desvio padrão: √8 ≈ 2,83.'],'A = 8 · DM = 2,4 · σ² = 8 · σ ≈ 2,83.'],
  ['Fundo A: retorno médio de 10% e desvio padrão de 2%. Fundo B: retorno médio de 20% e desvio padrão de 3%. Qual é relativamente mais estável?',
   ['CV de A = 2 ÷ 10 = 20%.','CV de B = 3 ÷ 20 = 15%.','Menor CV significa menor dispersão relativa.'],'O fundo B, apesar de ter o maior desvio padrão absoluto.']],
 'No mercado financeiro, o desvio padrão dos retornos tem nome próprio: volatilidade. É a principal medida de risco de um investimento e aparece nas lâminas de informações dos fundos.',
 'A variância fica em "unidades ao quadrado" (R$², min²). Para comparar com os dados, use o desvio padrão.',
 ['Todos os salários de uma equipe receberam um abono fixo de R$ 200. O desvio padrão dos salários:',['aumenta R$ 200','não muda','dobra'],1,'Somar o mesmo valor a todos desloca os dados sem espalhá-los.'],
 ['Amplitude = máximo − mínimo','σ² = média dos desvios ao quadrado; σ = √σ²','CV = σ ÷ média, para comparar grupos']),
A('Distribuição normal e indicadores','normal',
 'Altura de adultos, erros de medição, pequenas variações diárias de preço: muitos fenômenos formam um sino. Conhecer esse sino permite estimar quanto dos dados cai em cada faixa.',
 [['A curva normal','Simétrica em torno da média μ, em forma de sino. Nela, <b>média = mediana = moda</b>. A largura é dada pelo desvio padrão σ. A área total sob a curva é 1 (100%).'],
  ['Regra 68–95–99,7','Cerca de <b>68%</b> dos dados ficam entre μ − σ e μ + σ; <b>95%</b> entre μ − 2σ e μ + 2σ; <b>99,7%</b> entre μ − 3σ e μ + 3σ.'],
  ['Escore z','<span class="f">z = (x − μ) ÷ σ</span> diz a quantos desvios padrão um valor está da média. z = 2 é bem acima do comum; z = −1, um pouco abaixo.'],
  ['Assimetria','Se a média é maior que a mediana, a distribuição tem cauda longa à direita (assimetria positiva), como a renda. Se a média é menor, a cauda fica à esquerda.'],
  ['Indicadores','Taxas e índices são estatísticas. <b>Taxa de inadimplência</b> = contratos em atraso ÷ total de contratos. <b>Número-índice</b> = valor atual ÷ valor do período-base × 100. O IPCA, índice oficial de inflação, compara o custo de uma cesta de consumo ao longo do tempo.']],
 [['O tempo de atendimento segue distribuição normal com média de 12 min e desvio padrão de 3 min. Que porcentagem dos atendimentos dura entre 6 e 18 min?',
   ['6 = 12 − 2 × 3 e 18 = 12 + 2 × 3.','O intervalo é μ ± 2σ.','Pela regra empírica, ≈ 95%.'],'≈ 95%.'],
  ['Na mesma situação, que porcentagem dura mais de 15 min?',
   ['15 = μ + σ (z = 1).','Entre μ − σ e μ + σ ficam 68%; fora, 32%.','Por simetria, metade disso fica acima: 16%.'],'≈ 16%.'],
  ['Um índice valia 250 no período-base e vale 275 hoje. Qual o número-índice?',
   ['Número-índice = 275 ÷ 250 × 100.','275 ÷ 250 = 1,1 → 110.'],'110, ou seja, alta de 10% em relação à base.']],
 'A tábua de Galton, criada por Francis Galton no século XIX, é uma placa com pregos em que bolinhas caem desviando para a esquerda ou a direita. No fundo, elas se empilham quase perfeitamente no formato do sino da curva normal.',
 'A regra 68–95–99,7 só vale para distribuições aproximadamente normais. Para dados muito assimétricos, como renda, ela não se aplica.',
 ['Numa normal com média 50 e desvio padrão 5, o valor 60 tem escore z igual a:',['1','2','10'],1,'z = (60 − 50) ÷ 5 = 2.'],
 ['Normal: média = mediana = moda','68% em ±1σ, 95% em ±2σ, 99,7% em ±3σ','z = (x − μ) ÷ σ'])
],
fin:[
A('Juros simples','simples',
 'Seu Antônio emprestou R$ 1.000 a um amigo, combinando 2% ao mês "sobre o valor emprestado". Todo mês, a dívida cresce R$ 20, sempre a mesma quantia. Isso é juro simples: cresce em linha reta.',
 [['Os personagens','<b>C</b>: capital, o valor inicial.<br><b>i</b>: taxa de juros por período.<br><b>t</b> (ou n): número de períodos.<br><b>J</b>: juros.<br><b>M</b>: montante, capital mais juros.'],
  ['Fórmulas','<span class="f">J = C · i · t</span> · <span class="f">M = C + J = C · (1 + i · t)</span>'],
  ['Taxa e prazo na mesma unidade','Se a taxa é mensal, o prazo vai em meses. No regime simples, taxas <b>proporcionais</b> se convertem com multiplicação ou divisão: 36% a.a. = 3% a.m. = 0,1% a.d. (ano comercial de 360 dias).'],
  ['Onde aparece','Juros de mora em boletos (por exemplo, 1% ao mês, proporcional aos dias de atraso), desconto comercial de títulos e operações de curtíssimo prazo.']],
 [['Um capital de R$ 4.500 foi aplicado a juros simples de 1,5% ao mês por 8 meses. Qual o montante?',
   ['J = C · i · t = 4.500 × 0,015 × 8.','4.500 × 0,015 = 67,50 de juros por mês.','67,50 × 8 = 540.','M = 4.500 + 540.'],'R$ 5.040.'],
  ['Qual capital, aplicado a juros simples de 2% ao mês, gera montante de R$ 6.200 em 1 ano?',
   ['Prazo: 1 ano = 12 meses.','M = C · (1 + i · t) → 6.200 = C · (1 + 0,02 × 12).','1 + 0,24 = 1,24.','C = 6.200 ÷ 1,24.'],'R$ 5.000.'],
  ['Um boleto de R$ 800 foi pago com 15 dias de atraso. Há multa de 2% e juros de mora de 1% ao mês, proporcionais aos dias (mês de 30 dias). Quanto foi pago?',
   ['Multa: 2% de 800 = 16.','Juros: 15 dias são meio mês → 0,5% de 800 = 4.','Total: 800 + 16 + 4.'],'R$ 820.']],
 'Tábuas de argila da Mesopotâmia, com cerca de 4 mil anos, já registravam empréstimos de cevada e prata com juros. O Código de Hamurabi chegou a fixar limites para as taxas cobradas.',
 'Taxa de 2% ao mês por 1 ano não é 2 × 1. Converta o prazo: 12 meses × 2% = 24%.',
 ['A juros simples, R$ 1.000 a 5% ao mês rendem quanto de juros em 6 meses?',['R$ 300','R$ 340,10','R$ 1.300'],0,'J = 1.000 × 0,05 × 6 = 300. R$ 1.300 é o montante, não os juros.'],
 ['J = C · i · t e M = C(1 + i · t)','Taxa e prazo na mesma unidade','Juros simples crescem em linha reta']),
A('Juros compostos','juros',
 'Na poupança e no rotativo do cartão, os juros de um mês viram capital no mês seguinte e passam a render também. É o famoso "juros sobre juros", que cresce como bola de neve.',
 [['Fórmula','<span class="f">M = C · (1 + i)ⁿ</span> · <span class="f">J = M − C</span>. O termo (1 + i)ⁿ é o <b>fator de capitalização</b>.'],
  ['Simples × composto','No primeiro período, os dois regimes dão o mesmo resultado. Para n > 1, o composto rende mais. Para prazos menores que 1 período, o simples rende mais. As bancas exploram essa diferença.'],
  ['Potências sem calculadora','Monte por etapas: 1,1² = 1,21; 1,1³ = 1,331; 1,1⁴ = 1,4641. Ou use a tabela dada na prova: a FCC costuma fornecer valores como 1,02¹² ≈ 1,268.'],
  ['Regra do 72','Para estimar em quanto tempo um capital dobra a juros compostos: <span class="f">n ≈ 72 ÷ taxa (%)</span>. A 6% ao ano, cerca de 12 anos.']],
 [['R$ 5.000 aplicados a juros compostos de 2% ao mês por 3 meses. Qual o montante?',
   ['M = 5.000 × 1,02³.','1,02² = 1,0404.','1,0404 × 1,02 = 1,061208.','5.000 × 1,061208 = 5.306,04.'],'R$ 5.306,04. A juros simples, seriam R$ 5.300.'],
  ['Uma aplicação de R$ 2.000 virou R$ 2.420 em 2 meses, a juros compostos. Qual a taxa mensal?',
   ['2.420 ÷ 2.000 = 1,21 = (1 + i)².','Raiz quadrada de 1,21: 1 + i = 1,1.','i = 0,1.'],'10% ao mês.']],
 'Circula uma frase atribuída a Einstein, "os juros compostos são a oitava maravilha do mundo", mas não há registro de que ele a tenha dito. A matemática por trás é verdadeira: a 1% ao mês, um capital mais que triplica em 10 anos.',
 'Em juros compostos, a taxa mensal não vira anual multiplicando por 12: 1% a.m. equivale a 12,68% a.a., e não a 12%.',
 ['R$ 1.000 a juros compostos de 10% ao mês, por 3 meses, geram montante de:',['R$ 1.300','R$ 1.331','R$ 1.310'],1,'1,1³ = 1,331 → R$ 1.331.'],
 ['M = C(1 + i)ⁿ','Composto > simples quando n > 1','Regra do 72: dobra em ≈ 72 ÷ i períodos'],'juros'),
A('Taxas: nominal, efetiva, proporcional, equivalente e real','taxas',
 'O contrato diz "24% ao ano, capitalizados mensalmente". Parece 24%, mas você paga mais. Saber ler uma taxa é saber quanto o dinheiro realmente custa.',
 [['Proporcional (regime simples)','Divide ou multiplica pelo número de períodos: 24% a.a. ↔ 2% a.m. ↔ 6% a.t.'],
  ['Equivalente (regime composto)','Duas taxas são equivalentes quando levam ao mesmo montante no mesmo prazo: <span class="f">(1 + i_ano) = (1 + i_mês)¹²</span>. 1% a.m. equivale a 1,01¹² − 1 ≈ 12,68% a.a.'],
  ['Nominal × efetiva','<b>Nominal</b>: o período da taxa é diferente do período de capitalização ("12% a.a. capitalizados mensalmente"). Ela não é a taxa realmente paga. Para achar a <b>efetiva</b>: 1) divida a nominal pelo número de capitalizações (12% ÷ 12 = 1% a.m.); 2) capitalize: 1,01¹² − 1 ≈ 12,68% a.a.'],
  ['Taxa real (equação de Fisher)','Desconta a inflação: <span class="f">(1 + aparente) = (1 + real) · (1 + inflação)</span>. Uma aplicação de 10% com inflação de 4% tem ganho real de 1,10 ÷ 1,04 − 1 ≈ 5,77%.']],
 [['Qual a taxa efetiva anual de 24% ao ano com capitalização semestral?',
   ['Taxa do semestre: 24% ÷ 2 = 12%.','Capitalize por 2 semestres: 1,12² = 1,2544.','Efetiva: 1,2544 − 1 = 0,2544.'],'25,44% ao ano.'],
  ['Qual a taxa trimestral equivalente a 2% ao mês?',
   ['Trimestre = 3 meses, regime composto.','1,02³ = 1,061208.','1,061208 − 1 = 0,061208.'],'≈ 6,12% ao trimestre.'],
  ['Um CDB rendeu 13% em um ano com inflação de 5%. Qual foi o ganho real?',
   ['1 + real = 1,13 ÷ 1,05.','1,13 ÷ 1,05 ≈ 1,0762.'],'≈ 7,62%, e não os 8% da subtração simples.']],
 'A Selic é a taxa básica da economia brasileira e serve de referência para as demais. Quando o Copom a eleva, empréstimos tendem a ficar mais caros e as aplicações de renda fixa passam a render mais.',
 'Taxa nominal nunca entra direto na fórmula de juros compostos. Primeiro converta para a taxa do período de capitalização.',
 ['A juros simples, a taxa semestral proporcional a 3% ao mês é:',['18%','19,4%','3%'],0,'Proporcional: 3% × 6 = 18%. O 19,4% seria a taxa equivalente composta.'],
 ['Proporcional: × ou ÷ (regime simples)','Equivalente: (1 + i)ⁿ (regime composto)','Real: (1 + aparente) ÷ (1 + inflação) − 1']),
A('Desconto simples e composto','desc',
 'Uma loja vende a prazo e emite duplicatas para daqui a 3 meses. Precisando de dinheiro agora, leva os títulos ao banco, que antecipa o valor cobrando um desconto. Essa operação faz parte do dia a dia do técnico bancário.',
 [['Personagens','<b>N</b>: valor nominal (ou de face), devido no vencimento.<br><b>A</b>: valor atual, recebido hoje.<br><b>D</b>: desconto, <span class="f">D = N − A</span>.'],
  ['Desconto comercial simples ("por fora")','Calculado sobre o <b>nominal</b>: <span class="f">D = N · i · t</span> e <span class="f">A = N · (1 − i · t)</span>. É o mais usado pelos bancos.'],
  ['Desconto racional simples ("por dentro")','Calculado sobre o <b>atual</b>, como juros simples ao contrário: <span class="f">A = N ÷ (1 + i · t)</span>. Gera desconto menor que o comercial.'],
  ['Desconto composto','Racional composto: <span class="f">A = N ÷ (1 + i)ⁿ</span>, que é o próprio valor presente. Comercial composto: <span class="f">A = N · (1 − i)ⁿ</span>.'],
  ['Taxa efetiva do desconto comercial','Como o comercial incide sobre N, o custo real para quem desconta é maior que a taxa anunciada: <span class="f">i_efetiva = D ÷ A</span> no período.']],
 [['Uma duplicata de R$ 10.000 é descontada 3 meses antes do vencimento, a 2% ao mês. Compare o desconto comercial e o racional simples.',
   ['Comercial: D = 10.000 × 0,02 × 3 = 600 → A = 9.400.','Racional: A = 10.000 ÷ 1,06 ≈ 9.433,96 → D ≈ 566,04.','O comercial desconta mais (600 > 566,04).'],'Comercial: recebe R$ 9.400 · Racional: recebe ≈ R$ 9.433,96.'],
  ['No desconto comercial do exemplo anterior, qual a taxa efetiva mensal (juros simples) paga pela empresa?',
   ['Ela recebeu 9.400 hoje e "devolve" 10.000 em 3 meses.','Juros efetivos: 600 sobre 9.400 → 600 ÷ 9.400 ≈ 6,38% no trimestre.','Por mês (simples): 6,38% ÷ 3 ≈ 2,13%.'],'≈ 2,13% a.m., acima dos 2% anunciados.']],
 'A duplicata é um título de crédito criado no Brasil e regulado pela Lei 5.474, de 1968. Desde 2018 existe a duplicata escritural, registrada eletronicamente, o que facilita a antecipação de recebíveis nos bancos.',
 'No comercial, a conta usa o nominal; no racional, o atual. Leia o enunciado procurando "comercial", "bancário", "por fora", "racional" ou "por dentro".',
 ['Um título de R$ 5.000 é descontado 2 meses antes do vencimento, com desconto comercial simples de 3% ao mês. O valor recebido é:',['R$ 4.700','R$ 4.716,98','R$ 4.850'],0,'D = 5.000 × 0,03 × 2 = 300. A = 4.700. O valor de R$ 4.716,98 seria o desconto racional.'],
 ['D = N − A','Comercial: D = N · i · t (sobre o nominal)','Racional: A = N ÷ (1 + i · t)']),
A('Valor presente, valor futuro e equivalência de capitais','vpvf',
 'R$ 1.000 hoje valem mais que R$ 1.000 daqui a um ano, porque o dinheiro de hoje pode render. Para comparar valores em datas diferentes, é preciso levá-los para a mesma data.',
 [['Desenhe o fluxo de caixa','Trace uma linha com as datas (0, 1, 2…). Setas para cima são entradas; para baixo, saídas. Esse desenho simples evita a maior parte dos erros.'],
  ['Levar e trazer','Para o futuro: <span class="f">VF = VP · (1 + i)ⁿ</span>. Para o presente: <span class="f">VP = VF ÷ (1 + i)ⁿ</span>.'],
  ['Equivalência de capitais','Dois fluxos são equivalentes se têm o mesmo valor numa mesma <b>data focal</b>. No regime composto, qualquer data serve; escolha a que deixa a conta mais simples.'],
  ['Comparar propostas','Traga tudo para a data 0 (ou leve tudo para a mesma data futura) com a taxa de mercado. Para quem paga, a melhor proposta é a de <b>menor</b> valor presente.']],
 [['Uma TV custa R$ 2.100 à vista ou 2 parcelas de R$ 1.100 (entrada + 1 mês). Com juros de 5% ao mês, qual opção é melhor para o comprador?',
   ['Traga o parcelado para hoje: 1.100 + 1.100 ÷ 1,05.','1.100 ÷ 1,05 ≈ 1.047,62.','VP do parcelado ≈ 2.147,62.','Compare: 2.100 < 2.147,62.'],'À vista é melhor.'],
  ['Uma dívida tem duas parcelas: R$ 1.210 em 2 meses e R$ 1.331 em 3 meses. Com juros compostos de 10% ao mês, qual o valor para quitar tudo hoje?',
   ['1.210 ÷ 1,1² = 1.210 ÷ 1,21 = 1.000.','1.331 ÷ 1,1³ = 1.331 ÷ 1,331 = 1.000.','Some os valores presentes.'],'R$ 2.000.']],
 'O "valor do dinheiro no tempo" é a base para avaliar empresas, imóveis e títulos públicos. No Tesouro Direto, o preço de cada título muda todo dia porque é o valor presente dos pagamentos futuros, calculado com as taxas do momento.',
 'Nunca some valores de datas diferentes sem antes levá-los a uma mesma data.',
 ['Quanto é preciso aplicar hoje, a juros compostos de 10% ao mês, para ter R$ 1.210 em 2 meses?',['R$ 990','R$ 1.000','R$ 1.008,33'],1,'1.210 ÷ 1,21 = 1.000.'],
 ['VF = VP(1 + i)ⁿ e VP = VF ÷ (1 + i)ⁿ','Compare tudo na mesma data focal','Menor VP é melhor para quem paga']),
A('Séries de pagamentos, SAC e Price','sac',
 'Financiar um carro em 48 parcelas é trocar um valor de hoje por uma série de pagamentos. Como o banco calcula cada parcela? E por que a dívida demora a cair no começo?',
 [['Série uniforme (parcelas iguais)','Valor presente de n parcelas iguais P, postecipadas (a 1ª vence 1 período depois):<br><span class="f">VP = P · [1 − (1 + i)⁻ⁿ] ÷ i</span>. A expressão que multiplica P é o <b>fator de valor atual</b> (aₙ⌐ᵢ), em geral dado em tabela na prova.'],
  ['Série antecipada','Se a 1ª parcela é paga no ato (entrada), a série é antecipada: equivale a 1 parcela à vista mais uma série postecipada de n − 1 parcelas.'],
  ['Sistema Price (francês)','Parcelas <b>iguais</b>. Juros = taxa × saldo devedor; amortização = parcela − juros. No começo, a parcela é quase toda juros; com o tempo, a amortização cresce.'],
  ['SAC (Sistema de Amortização Constante)','<span class="f">Amortização = VP ÷ n</span>, sempre igual. Juros = taxa × saldo devedor. A parcela começa mais alta e <b>cai</b> todo mês em progressão aritmética: a queda mensal é amortização × i.'],
  ['Comparando','A 1ª parcela do SAC é maior que a da Price. O total de juros pago no SAC é menor, porque o saldo cai mais rápido. Os financiamentos imobiliários no Brasil usam muito o SAC.']],
 [['Empréstimo de R$ 30.000 pelo SAC, em 5 parcelas mensais, a 2% ao mês. Calcule as duas primeiras parcelas e a última.',
   ['Amortização: 30.000 ÷ 5 = 6.000.','1ª parcela: juros = 2% de 30.000 = 600 → 6.000 + 600 = 6.600.','2ª parcela: saldo de 24.000 → juros de 480 → 6.480.','A parcela cai 120 por mês (6.000 × 2%).','5ª parcela: saldo de 6.000 → juros de 120 → 6.120.'],'R$ 6.600 · R$ 6.480 · … · R$ 6.120.'],
  ['Um empréstimo de R$ 10.000, a 10% ao mês, será pago pela Price em 2 parcelas. Calcule a parcela e monte a tabela.',
   ['10.000 = P ÷ 1,1 + P ÷ 1,21.','1 ÷ 1,1 + 1 ÷ 1,21 ≈ 0,90909 + 0,82645 = 1,73554.','P = 10.000 ÷ 1,73554 ≈ 5.761,90.','1º mês: juros = 10% de 10.000 = 1.000; amortização = 5.761,90 − 1.000 = 4.761,90; saldo = 5.238,10.','2º mês: juros ≈ 523,81; amortização ≈ 5.238,09; o saldo zera.'],'Parcela ≈ R$ 5.761,90.']],
 'A Tabela Price leva o nome de Richard Price, pastor e matemático galês que publicou em 1771 tabelas de juros compostos e anuidades. Fora do Brasil, o mesmo método é chamado de sistema francês de amortização.',
 'Na Price, a parcela é fixa e a amortização cresce. No SAC, a amortização é fixa e a parcela cai. Trocar os dois é a pegadinha mais comum.',
 ['No SAC, o que permanece igual em todas as parcelas?',['o valor da parcela','a amortização','os juros'],1,'SAC é o Sistema de Amortização Constante. A parcela cai porque os juros caem.'],
 ['VP = P · [1 − (1 + i)⁻ⁿ] ÷ i','Price: parcela fixa, amortização crescente','SAC: amortização fixa, parcela decrescente'],'amort')
]};

cont:[['Princípio multiplicativo','m × n','Etapas sucessivas ("e")'],['Princípio aditivo','m + n','Grupos separados ("ou")'],['Fatorial','n! = n · (n − 1) · … · 1','0! = 1'],['Permutação simples','Pₙ = n!',''],['Permutação com repetição','n! ÷ (a! · b! · …)',''],['Arranjo','A(n,p) = n! ÷ (n − p)!','Ordem importa'],['Combinação','C(n,p) = n! ÷ [p! (n − p)!]','Ordem não importa'],['Probabilidade','P = favoráveis ÷ possíveis',''],['Complementar','P(não A) = 1 − P(A)',''],['União','P(A ∪ B) = P(A) + P(B) − P(A ∩ B)',''],['Condicional','P(A | B) = P(A ∩ B) ÷ P(B)',''],['Independência','P(A ∩ B) = P(A) · P(B)','']],
